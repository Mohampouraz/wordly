<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حدس کلمه | Wordly</title>
    
    <!-- فونت Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-color: #f093fb;
            --success-color: #4CAF50;
            --danger-color: #f44336;
            --warning-color: #ff9800;
            --text-color: #333;
            --text-light: #666;
            --bg-color: #fff;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* لودینگ اسپینر */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .spinner-circle {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .spinner-circle:nth-child(1) { animation-delay: -0.32s; }
        .spinner-circle:nth-child(2) { animation-delay: -0.16s; }
        .spinner-circle:nth-child(3) { animation-delay: 0s; }
        .spinner-circle:nth-child(4) { animation-delay: 0.16s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loading-text {
            text-align: center;
            color: white;
        }

        .loading-text h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .loading-text p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* محتوای اصلی */
        .main-container {
            min-height: 100vh;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .main-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* هیرو سکشن */
        .hero-section {
            position: relative;
            padding: 80px 0 60px;
            background: var(--gradient);
            color: white;
            overflow: hidden;
            text-align: center;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><polygon fill="rgba(255,255,255,0.05)" points="0,1000 1000,0 1000,1000"/></svg>');
            background-size: cover;
        }

        .hero-section .container {
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .gradient-text {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* بخش بازی */
        .game-section {
            padding: 40px 0;
            background: white;
            min-height: 60vh;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
        }

        .word-display {
            font-size: 2.5rem;
            text-align: center;
            margin: 30px 0;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--text-color);
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .letter {
            display: inline-block;
            width: 50px;
            height: 60px;
            border-bottom: 3px solid var(--primary-color);
            margin: 0 5px;
            text-align: center;
            line-height: 60px;
            font-size: 2rem;
        }

        .letter.visible {
            border-bottom-color: transparent;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin: 30px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .key {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Vazirmatn', sans-serif;
        }

        .key:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .key:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.6;
        }

        .key.correct {
            background: var(--success-color);
        }

        .key.incorrect {
            background: var(--danger-color);
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient-2);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: var(--text-color);
            border: 2px solid #e9ecef;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .hint-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
            border-right: 4px solid var(--primary-color);
        }

        .hint-text {
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .category-badge {
            display: inline-block;
            background: var(--gradient);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        /* انیمیشن‌ها */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .bounce-in {
            animation: bounceIn 0.6s ease-out;
        }

        /* مدال پایان بازی */
        .game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .game-over-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .modal-icon.win {
            color: var(--success-color);
        }

        .modal-icon.lose {
            color: var(--danger-color);
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .modal-stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .stat-value {
            font-weight: 700;
            color: var(--primary-color);
        }

        /* ریسپانسیو */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .game-title {
                font-size: 1.5rem;
            }
            
            .word-display {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            
            .letter {
                width: 35px;
                height: 45px;
                line-height: 45px;
                font-size: 1.5rem;
            }
            
            .keyboard {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }
            
            .key {
                padding: 12px;
                font-size: 1rem;
            }
            
            .game-stats {
                gap: 15px;
            }
            
            .stat-item {
                min-width: 100px;
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 1.6rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .game-container {
                padding: 20px;
            }
            
            .keyboard {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .game-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- اسپینر لودینگ -->
    <div id="loading" class="loading-container">
        <div class="spinner">
            <div class="spinner-circle"></div>
            <div class="spinner-circle"></div>
            <div class="spinner-circle"></div>
            <div class="spinner-circle"></div>
        </div>
        <div class="loading-text">
            <h2>در حال آماده‌سازی بازی...</h2>
            <p>لطفاً چند لحظه صبر کنید</p>
        </div>
    </div>

    <!-- صفحه اصلی -->
    <div id="main-content" class="main-container hidden">
        <!-- هدر -->
        <header class="hero-section">
            <div class="hero-bg"></div>
            <div class="container">
                <div class="logo">
                    <i class="fas fa-puzzle-piece"></i>
                </div>
                <h1 class="hero-title">
                    بازی <span class="gradient-text">حدس کلمه</span>
                </h1>
                <p class="hero-subtitle">
                    بازی جذاب و آموزشی برای تقویت دایره لغات فارسی
                </p>
            </div>
        </header>

        <!-- بخش بازی -->
        <section class="game-section">
            <div class="container">
                <div class="game-container">
                    <div class="game-header">
                        <h2 class="game-title">حدس کلمه</h2>
                        <div class="game-stats">
                            <div class="stat-item">
                                <i class="fas fa-heart"></i>
                                <span id="attempts-left">۶ فرصت</span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-star"></i>
                                <span id="score">۰ امتیاز</span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-layer-group"></i>
                                <span id="difficulty">آسان</span>
                            </div>
                        </div>
                    </div>

                    <div class="hint-section">
                        <div class="category-badge" id="category">عمومی</div>
                        <div class="hint-text" id="hint-text">راهنمایی: در حال بارگذاری...</div>
                    </div>

                    <div class="word-display" id="word-display">
                        <!-- کلمه اینجا نمایش داده می‌شود -->
                    </div>

                    <div class="keyboard" id="keyboard">
                        <!-- کیبورد حروف اینجا ساخته می‌شود -->
                    </div>

                    <div class="game-controls">
                        <button class="btn btn-primary" id="hint-btn">
                            <i class="fas fa-lightbulb"></i>
                            راهنمایی بیشتر
                        </button>
                        <button class="btn btn-secondary" id="new-game-btn">
                            <i class="fas fa-redo"></i>
                            بازی جدید
                        </button>
                        <button class="btn btn-secondary" id="change-difficulty-btn">
                            <i class="fas fa-sliders-h"></i>
                            تغییر سطح
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- مدال پایان بازی -->
    <div class="game-over-modal" id="game-over-modal">
        <div class="modal-content">
            <div class="modal-icon win" id="modal-icon">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 class="modal-title" id="modal-title">تبریک! برنده شدید</h2>
            <div class="modal-stats">
                <div class="stat-row">
                    <span>کلمه:</span>
                    <span class="stat-value" id="modal-word">---</span>
                </div>
                <div class="stat-row">
                    <span>امتیاز کسب شده:</span>
                    <span class="stat-value" id="modal-score">۰</span>
                </div>
                <div class="stat-row">
                    <span>فرصت‌های باقی‌مانده:</span>
                    <span class="stat-value" id="modal-attempts">۰</span>
                </div>
                <div class="stat-row">
                    <span>زمان بازی:</span>
                    <span class="stat-value" id="modal-time">۰ ثانیه</span>
                </div>
            </div>
            <button class="btn btn-primary" id="play-again-btn">
                <i class="fas fa-play-circle"></i>
                بازی مجدد
            </button>
        </div>
    </div>

    <script>
        // دیتابیس کلمات
        const WORD_DATABASE = {
            "آسان": [
                {word: "کتاب", hint: "چیزی که می‌خواند", category: "آموزشی"},
                {word: "میز", hint: "روی آن می‌نویسیم", category: "وسایل"},
                {word: "خانه", hint: "جایی که زندگی می‌کنیم", category: "مکان"},
                {word: "آب", hint: "مایع حیات", category: "طبیعت"},
                {word: "درخت", hint: "سبز و پر از برگ", category: "طبیعت"},
                {word: "خورشید", hint: "منبع نور و گرما", category: "طبیعت"},
                {word: "مادر", hint: "عزیزترین فرد خانواده", category: "خانواده"},
                {word: "مدرسه", hint: "محل یادگیری", category: "آموزشی"}
            ],
            "متوسط": [
                {word: "کامپیوتر", hint: "وسیله ای که الان استفاده می‌کنی", category: "تکنولوژی"},
                {word: "برنامه", hint: "مجموعه ای از دستورات", category: "کامپیوتر"},
                {word: "آموزش", hint: "فرآیند یادگیری", category: "آموزشی"},
                {word: "زبان", hint: "وسیله ارتباط بین انسان ها", category: "ارتباطات"},
                {word: "کد", hint: "دستورات کامپیوتری", category: "برنامه‌نویسی"},
                {word: "اینترنت", hint: "شبکه جهانی اطلاعات", category: "تکنولوژی"},
                {word: "دانشگاه", hint: "محل تحصیلات عالی", category: "آموزشی"},
                {word: "پزشک", hint: "درمانگر بیماری‌ها", category: "شغلی"}
            ],
            "سخت": [
                {word: "الگوریتم", hint: "مجموعه دستورات مرحله به مرحله", category: "برنامه‌نویسی"},
                {word: "هوش مصنوعی", hint: "شبیه سازی هوش انسان", category: "تکنولوژی"},
                {word: "برنامه‌نویسی", hint: "حرفه ساخت نرم افزار", category: "شغلی"},
                {word: "پایتون", hint: "یک زبان برنامه نویسی", category: "زبان‌ها"},
                {word: "تلگرام", hint: "پیام رسانی که الان استفاده می‌کنی", category: "اپلیکیشن"},
                {word: "یادگیری ماشین", hint: "زیرشاخه هوش مصنوعی", category: "تکنولوژی"},
                {word: "دیتابیس", hint: "محل ذخیره اطلاعات", category: "کامپیوتر"},
                {word: "سرور", hint: "ارائه‌دهنده خدمات شبکه", category: "کامپیوتر"}
            ]
        };

        // حروف فارسی
        const PERSIAN_LETTERS = [
            'ا', 'ب', 'پ', 'ت', 'ث', 'ج', 'چ', 'ح', 'خ', 'د',
            'ذ', 'ر', 'ز', 'ژ', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ',
            'ع', 'غ', 'ف', 'ق', 'ک', 'گ', 'ل', 'م', 'ن', 'و', 'ه', 'ی'
        ];

        class WordGame {
            constructor() {
                this.difficulty = 'آسان';
                this.currentWord = null;
                this.guessedLetters = new Set();
                this.attemptsLeft = 6;
                this.score = 0;
                this.gameOver = false;
                this.startTime = null;
                this.selectedWord = null;
                
                this.initializeGame();
            }

            initializeGame() {
                this.selectWord();
                this.createKeyboard();
                this.updateDisplay();
                this.startTime = new Date();
            }

            selectWord() {
                const words = WORD_DATABASE[this.difficulty];
                this.selectedWord = words[Math.floor(Math.random() * words.length)];
                this.currentWord = this.selectedWord.word;
            }

            createKeyboard() {
                const keyboard = document.getElementById('keyboard');
                keyboard.innerHTML = '';

                PERSIAN_LETTERS.forEach(letter => {
                    const key = document.createElement('button');
                    key.className = 'key';
                    key.textContent = letter;
                    key.dataset.letter = letter;
                    key.addEventListener('click', () => this.guessLetter(letter));
                    
                    if (this.guessedLetters.has(letter)) {
                        key.disabled = true;
                        if (this.currentWord.includes(letter)) {
                            key.classList.add('correct');
                        } else {
                            key.classList.add('incorrect');
                        }
                    }
                    
                    keyboard.appendChild(key);
                });
            }

            guessLetter(letter) {
                if (this.gameOver || this.guessedLetters.has(letter)) return;

                this.guessedLetters.add(letter);
                const key = document.querySelector(`.key[data-letter="${letter}"]`);
                
                if (this.currentWord.includes(letter)) {
                    // حرف درست
                    key.classList.add('correct');
                    this.calculateScore(true);
                    
                    if (this.isWordGuessed()) {
                        this.endGame(true);
                    }
                } else {
                    // حرف اشتباه
                    key.classList.add('incorrect');
                    this.attemptsLeft--;
                    this.calculateScore(false);
                    
                    if (this.attemptsLeft <= 0) {
                        this.endGame(false);
                    }
                }

                this.updateDisplay();
            }

            isWordGuessed() {
                for (let char of this.currentWord) {
                    if (!this.guessedLetters.has(char)) {
                        return false;
                    }
                }
                return true;
            }

            calculateScore(isCorrect) {
                const difficultyScores = { 'آسان': 10, 'متوسط': 20, 'سخت': 30 };
                const baseScore = difficultyScores[this.difficulty];
                
                if (isCorrect) {
                    // امتیاز زمان
                    const timeElapsed = (new Date() - this.startTime) / 1000;
                    const timeBonus = Math.max(0, 50 - Math.floor(timeElapsed / 10));
                    
                    this.score += baseScore + timeBonus;
                }
            }

            endGame(isWin) {
                this.gameOver = true;
                
                // غیرفعال کردن تمام کلیدها
                document.querySelectorAll('.key').forEach(key => {
                    key.disabled = true;
                });

                // محاسبه زمان بازی
                const endTime = new Date();
                const gameTime = Math.floor((endTime - this.startTime) / 1000);

                // نمایش مدال پایان بازی
                this.showGameOverModal(isWin, gameTime);
            }

            showGameOverModal(isWin, gameTime) {
                const modal = document.getElementById('game-over-modal');
                const modalIcon = document.getElementById('modal-icon');
                const modalTitle = document.getElementById('modal-title');
                const modalWord = document.getElementById('modal-word');
                const modalScore = document.getElementById('modal-score');
                const modalAttempts = document.getElementById('modal-attempts');
                const modalTime = document.getElementById('modal-time');

                if (isWin) {
                    modalIcon.className = 'modal-icon win';
                    modalIcon.innerHTML = '<i class="fas fa-trophy"></i>';
                    modalTitle.textContent = 'تبریک! برنده شدید 🎉';
                    
                    // امتیاز نهایی برای برنده
                    const completionBonus = { 'آسان': 50, 'متوسط': 100, 'سخت': 150 };
                    this.score += completionBonus[this.difficulty];
                } else {
                    modalIcon.className = 'modal-icon lose';
                    modalIcon.innerHTML = '<i class="fas fa-heart-broken"></i>';
                    modalTitle.textContent = 'متاسفانه باختید 💔';
                }

                modalWord.textContent = this.currentWord;
                modalScore.textContent = this.score;
                modalAttempts.textContent = this.attemptsLeft;
                modalTime.textContent = `${gameTime} ثانیه`;

                modal.classList.add('active');
            }

            updateDisplay() {
                // نمایش کلمه
                const wordDisplay = document.getElementById('word-display');
                wordDisplay.innerHTML = '';
                
                for (let char of this.currentWord) {
                    const letterSpan = document.createElement('span');
                    letterSpan.className = 'letter';
                    
                    if (this.guessedLetters.has(char) || char === ' ') {
                        letterSpan.textContent = char;
                        letterSpan.classList.add('visible', 'bounce-in');
                    } else {
                        letterSpan.textContent = '_';
                    }
                    
                    wordDisplay.appendChild(letterSpan);
                }

                // آپدیت آمار
                document.getElementById('attempts-left').textContent = `${this.attemptsLeft} فرصت`;
                document.getElementById('score').textContent = `${this.score} امتیاز`;
                document.getElementById('difficulty').textContent = this.difficulty;
                document.getElementById('category').textContent = this.selectedWord.category;
                document.getElementById('hint-text').textContent = `راهنمایی: ${this.selectedWord.hint}`;
            }

            resetGame() {
                this.guessedLetters.clear();
                this.attemptsLeft = 6;
                this.score = 0;
                this.gameOver = false;
                this.selectWord();
                this.createKeyboard();
                this.updateDisplay();
                this.startTime = new Date();
                
                // بستن مدال
                document.getElementById('game-over-modal').classList.remove('active');
            }

            changeDifficulty(newDifficulty) {
                this.difficulty = newDifficulty;
                this.resetGame();
            }
        }

        // مدیریت رویدادهای صفحه
        document.addEventListener('DOMContentLoaded', function() {
            const loading = document.getElementById('loading');
            const mainContent = document.getElementById('main-content');
            let game;

            // لودینگ ۳ ثانیه
            setTimeout(() => {
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                    mainContent.classList.remove('hidden');
                    
                    // شروع بازی
                    game = new WordGame();
                }, 500);
            }, 3000);

            // رویدادهای دکمه‌ها
            document.getElementById('new-game-btn').addEventListener('click', () => {
                game.resetGame();
            });

            document.getElementById('hint-btn').addEventListener('click', () => {
                // پیدا کردن حروف حدس زده نشده
                const unguessedLetters = [];
                for (let char of game.currentWord) {
                    if (!game.guessedLetters.has(char) && char !== ' ') {
                        unguessedLetters.push(char);
                    }
                }
                
                if (unguessedLetters.length > 0) {
                    const randomHint = unguessedLetters[Math.floor(Math.random() * unguessedLetters.length)];
                    alert(`راهنمایی: حرف "${randomHint}" را امتحان کنید!`);
                } else {
                    alert('همه حروف را حدس زده‌اید!');
                }
            });

            document.getElementById('change-difficulty-btn').addEventListener('click', () => {
                const difficulties = ['آسان', 'متوسط', 'سخت'];
                const currentIndex = difficulties.indexOf(game.difficulty);
                const nextIndex = (currentIndex + 1) % difficulties.length;
                game.changeDifficulty(difficulties[nextIndex]);
            });

            document.getElementById('play-again-btn').addEventListener('click', () => {
                game.resetGame();
            });

            // پشتیبانی از صفحه کلید فیزیکی
            document.addEventListener('keydown', (event) => {
                if (game && !game.gameOver) {
                    const key = event.key;
                    const persianKey = convertToPersian(key);
                    
                    if (PERSIAN_LETTERS.includes(persianKey)) {
                        game.guessLetter(persianKey);
                    }
                }
            });

            // تبدیل حروف انگلیسی به فارسی
            function convertToPersian(key) {
                const mapping = {
                    'a': 'ا', 'b': 'ب', 'c': 'ث', 'd': 'د', 'e': 'ی',
                    'f': 'ف', 'g': 'گ', 'h': 'ه', 'i': 'ی', 'j': 'ج',
                    'k': 'ک', 'l': 'ل', 'm': 'م', 'n': 'ن', 'o': 'و',
                    'p': 'پ', 'q': 'ق', 'r': 'ر', 's': 'س', 't': 'ت',
                    'u': 'و', 'v': 'ط', 'w': 'و', 'x': 'خ', 'y': 'ی',
                    'z': 'ز'
                };
                
                return mapping[key.toLowerCase()] || key;
            }
        });
    </script>
</body>
