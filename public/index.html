<!-- index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حدس کلمه</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h1>بازی حدس کلمه</h1>
        <div id="game-status">در حال انتظار برای بازیکن دیگر...</div>
        <div id="word-display"></div>
        <div id="timer">زمان باقی‌مانده: <span id="time-left"></span></div>
        <input type="text" id="guess-input" maxlength="1" placeholder="یک حرف حدس بزنید">
        <button id="guess-btn">حدس زدن</button>
        <button id="hint-btn">راهنمایی بگیر (-۵۰ امتیاز)</button>
        <div id="score">امتیاز شما: <span id="your-score">۰</span></div>
        <div id="opponent-score">امتیاز حریف: <span id="opp-score">۰</span></div>
        <div id="words-left">کلمات باقی‌مانده: ۱۰</div>
        <div id="add-word-section">
            <h2>اضافه کردن کلمه جدید</h2>
            <select id="category-select">
                <option value="city">شهر</option>
                <option value="country">کشور</option>
                <option value="fruit">میوه</option>
                <option value="object">اشیاء</option>
                <option value="name">نام</option>
            </select>
            <input type="text" id="new-word" placeholder="کلمه جدید وارد کنید">
            <input type="number" id="new-level" min="1" max="5" placeholder="سطح (۱-۵)">
            <button id="add-word-btn">اضافه کردن کلمه</button>
        </div>
        <div id="end-game" style="display: none;">
            <h2>بازی تمام شد!</h2>
            <p id="winner-msg"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
