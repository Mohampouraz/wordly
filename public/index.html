<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلاعات کاربر - Wordly Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/jalaali.min.js"></script>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
        }
        button {
            background: #ffd700;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #ffed4e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>خوش آمدید!</h1>
        <div id="loading" class="loading">در حال بارگذاری اطلاعات...</div>
        <div id="info" style="display: none;">
            <div class="info-item">ID: <span id="userId"></span></div>
            <div class="info-item">نام کاربری: <span id="username"></span></div>
            <div class="info-item">نام: <span id="firstName"></span></div>
            <div class="info-item">تاریخ و زمان (شمسی): <span id="persianDate"></span></div>
            <button onclick="Telegram.WebApp.close()">بستن</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Mini App رو آماده کن

        // اطلاعات initDataUnsafe از تلگرام (شامل user data)
        const initData = tg.initDataUnsafe;
        const user = initData.user;

        if (user) {
            // اطلاعات اولیه کاربر
            document.getElementById('userId').textContent = user.id;
            document.getElementById('username').textContent = user.username || 'ندارد';
            document.getElementById('firstName').textContent = user.first_name || 'ندارد';

            // درخواست به سرور برای اطلاعات اضافی (اختیاری، مثلاً ذخیره در DB)
            fetch('https://wordlygame.onrender.com/user-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData }) // initData رو بفرست برای اعتبارسنجی در سرور
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // تاریخ شمسی (از کتابخونه jalaali-js)
                    const now = new Date();
                    const persian = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
                    const persianTime = now.toLocaleTimeString('fa-IR');
                    document.getElementById('persianDate').textContent = 
                        `${persian.jy}/${persian.jm}/${persian.jd} - ${persianTime}`;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('info').style.display = 'block';
                }
            })
            .catch(err => {
                console.error('خطا در اتصال به سرور:', err);
                // fallback: بدون سرور، فقط تاریخ محلی
                const now = new Date();
                const persian = jalaali.toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
                document.getElementById('persianDate').textContent = `${persian.jy}/${persian.jm}/${persian.jd}`;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').style.display = 'block';
            });
        } else {
            document.getElementById('loading').textContent = 'خطا در دریافت اطلاعات کاربر';
        }

        // تم تلگرام رو اعمال کن
        tg.expand(); // تمام‌صفحه کن
    </script>
</body>
</html>
