<!-- public/index.html -->
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>وردلی رقابتی — نسخه تلگرام</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{ --muted:#6b7280; --accent:#4f46e5; --border:rgba(15,23,42,0.06) }
    *{box-sizing:border-box;font-family:'Vazirmatn',system-ui}
    body{margin:0;padding:14px;background:#f6f9ff;color:#071326}
    .shell{max-width:1100px;margin:18px auto;background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border)}
    .row{display:flex;justify-content:space-between;align-items:center}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,var(--accent),#06b6d4);color:#fff;border:none}
    .panel{padding:12px;border-radius:12px;border:1px solid var(--border);background:#fff;margin-top:12px}
    .word-slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .slot{min-width:44px;height:56px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;background:#fbfdff}
    .slot.revealed{background:linear-gradient(90deg,rgba(79,70,229,0.06),rgba(6,182,212,0.04)); color:var(--accent);font-weight:800}
    .slot.opponent{background:#fff7ed;border:1px dashed #f59e0b;color:#92400e}
    .gap{width:22px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff}
    .players-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .player-row{display:flex;justify-content:space-between;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--border);background:#fff;align-items:center}
    .muted{color:var(--muted)}
    .reveal-ind{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff}
    .shake{animation:shake .26s}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="row">
      <div>
        <strong>وردلی رقابتی</strong>
        <div class="muted">دو نفره · بلادرنگ</div>
      </div>
      <div style="text-align:right">
        <div id="userFull" style="font-weight:800">کاربر مهمان</div>
        <div id="userId" class="muted">—</div>
      </div>
    </div>

    <div class="panel" id="lobby">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <select id="levelSelect" style="padding:8px;border-radius:10px;border:1px solid var(--border);background:#fff">
            <option value="easy">آسان</option><option value="medium" selected>متوسط</option><option value="hard">سخت</option>
          </select>
          <button id="quickJoin" class="btn primary">پیوستن سریع</button>
          <button id="manageRoomsBtn" class="btn">مدیریت اتاق‌ها</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="revealModeLabel" class="reveal-ind">مود: مشترک</div>
        </div>
      </div>
      <div id="roomsList" style="margin-top:12px"></div>
    </div>

    <div id="gamePanel" class="panel" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div id="categoryName" style="font-weight:800">—</div>
          <div id="levelName" class="muted">—</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="muted">کلمه: <span id="wordIndex">—</span>/10</div>
          <div id="timer" class="muted">۰۰:۰۰</div>
        </div>
      </div>

      <div id="wordSlots" class="word-slots" style="margin-top:12px"></div>

      <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
        <input id="letterInput" type="text" dir="rtl" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" maxlength="2" placeholder="حرف" style="width:86px;height:56px;font-size:20px;text-align:center;border-radius:10px;border:1px solid var(--border)" />
        <button id="guessBtn" class="btn primary">حدس</button>
        <button id="hintBtn" class="btn">راهنما</button>
        <button id="leaveBtn" class="btn">ترک اتاق</button>
      </div>

      <div style="display:flex;gap:12px;margin-top:12px">
        <div style="flex:1">
          <div style="font-weight:800">حروف صحیح</div>
          <div id="correctLetters" class="chips"></div>
        </div>
        <div style="flex:1">
          <div style="font-weight:800">حروف غلط</div>
          <div id="wrongLetters" class="chips"></div>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:12px;align-items:center">
        <div style="flex:1">
          <div style="font-weight:800">امتیاز شما</div>
          <div id="scoreMe" style="font-size:24px;color:var(--accent);font-weight:800">۰</div>
          <div id="progressMe" class="muted">—</div>
        </div>
        <div style="width:320px">
          <div style="font-weight:800">بازیکنان</div>
          <div id="playersList" class="players-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // ---------- Helpers ----------
    const toFaDigits = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

    function normalizeFaLetter(ch){ if (!ch) return ''; const map = {'\u064A':'\u06CC','\u0643':'\u06A9'}; return (map[ch]||ch).normalize('NFC'); }
    function normalizeFaWordKeepSpaces(word){ if(!word) return ''; const removeMarks=/[\u0640\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g; let w=String(word).replace(removeMarks,''); w=w.replace(/\u064A/g,'\u06CC').replace(/\u0643/g,'\u06A9'); return w.normalize('NFC'); }
    function normalizeDisplayWord(word){ return String(word).replace(/\s/g,''); }
    function buildIndexMap(word){ const map=[]; let disp=0; for(let i=0;i<word.length;i++){ const ch=word[i]; if (ch===' '){ map[i]=null; continue } map[i]=disp++; } return map; }
    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ---------- State & socket ----------
    const state = { myId: null, fullname: 'کاربر مهمان', roomId: null, gameId: null, deck: [], gameState: null, indexMap: [], revealMode: 'shared', composing:false };
    const socket = io();

    // DOM
    const userFull = document.getElementById('userFull');
    const userId = document.getElementById('userId');
    const quickJoin = document.getElementById('quickJoin');
    const manageRoomsBtn = document.getElementById('manageRoomsBtn');
    const roomsList = document.getElementById('roomsList');
    const levelSelect = document.getElementById('levelSelect');

    const gamePanel = document.getElementById('gamePanel');
    const categoryName = document.getElementById('categoryName');
    const levelName = document.getElementById('levelName');
    const wordIndex = document.getElementById('wordIndex');
    const timerEl = document.getElementById('timer');
    const wordSlots = document.getElementById('wordSlots');
    const letterInput = document.getElementById('letterInput');
    const guessBtn = document.getElementById('guessBtn');
    const hintBtn = document.getElementById('hintBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const correctLetters = document.getElementById('correctLetters');
    const wrongLetters = document.getElementById('wrongLetters');
    const playersList = document.getElementById('playersList');
    const scoreMe = document.getElementById('scoreMe');
    const progressMe = document.getElementById('progressMe');
    const revealModeLabel = document.getElementById('revealModeLabel');

    // ---------- Telegram WebApp init ----------
    (async function initTelegram(){
      function waitForTelegram(timeout = 3000){
        return new Promise(resolve => {
          const start = Date.now();
          (function check(){
            if (window.Telegram && window.Telegram.WebApp) return resolve(window.Telegram.WebApp);
            if (Date.now() - start > timeout) return resolve(null);
            setTimeout(check, 50);
          })();
        });
      }
      const tg = await waitForTelegram(3000);
      if (tg) {
        try {
          const initData = tg.initData || '';
          const user = tg.initDataUnsafe?.user || null;
          if (user && user.id) {
            state.myId = user.id;
            state.fullname = `${user.first_name || ''}${user.last_name ? ' ' + user.last_name : ''}`.trim() || (`#${state.myId}`);
            userFull.textContent = state.fullname;
            userId.textContent = toFaDigits(state.myId);
            fetch('/auth/telegram', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ initData, user }) }).catch(()=>{});
            try { tg.expand(); } catch(e){}
          } else fallbackGuest();
        } catch (e) { fallbackGuest(); }
      } else fallbackGuest();
      loadPublicRooms();
    })();

    function fallbackGuest(){
      if (!state.myId) state.myId = Math.floor(100000 + Math.random()*899999);
      userFull.textContent = state.fullname;
      userId.textContent = toFaDigits(state.myId);
    }

    // ---------- Rooms UI ----------
    manageRoomsBtn.addEventListener('click', loadPublicRooms);

    async function loadPublicRooms(){
      try {
        const res = await fetch('/rooms/list');
        const d = await res.json();
        roomsList.innerHTML = '';
        if (!d.ok) return roomsList.textContent = 'خطا';
        d.rooms.forEach(r => {
          const el = document.createElement('div'); el.className='panel'; el.style.display='flex'; el.style.justifyContent='space-between'; el.style.alignItems='center'; el.style.marginTop='8px';
          el.innerHTML = `<div><strong>${escapeHtml(r.name||'اتاق')}</strong><div class="muted">${escapeHtml(r.level||'—')} · ${toFaDigits(r.players||0)}/${toFaDigits(r.max_players||2)} · مود:${escapeHtml(r.reveal_mode||'shared')}</div></div>`;
          const btn = document.createElement('button'); btn.className='btn'; btn.textContent='پیوستن';
          btn.addEventListener('click', ()=> joinRoom(r.id));
          el.appendChild(btn); roomsList.appendChild(el);
        });
      } catch (e) { roomsList.textContent='خطا'; }
    }

    async function joinRoom(roomId){
      try {
        const res = await fetch('/rooms/join', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ room_id: roomId, user_id: state.myId })});
        const d = await res.json();
        if (!d.ok){ alert('پیوستن ممکن نیست'); return; }
        state.roomId = d.room_id;
        socket.emit('join-room', { room_id: state.roomId, user_id: state.myId });
      } catch (e) { alert('خطا'); }
    }

    quickJoin.addEventListener('click', async () => {
      try {
        const res = await fetch('/rooms/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id: state.myId, name: 'اتاق سریع', level: levelSelect.value || 'medium', max_players: 2 })});
        const d = await res.json();
        if (!d.ok) { alert('خطا'); return; }
        state.roomId = d.room_id;
        socket.emit('join-room', { room_id: state.roomId, user_id: state.myId });
      } catch (e) { alert('خطا'); }
    });

    // ---------- Input/IME handling ----------
    letterInput.addEventListener('compositionstart', ()=> state.composing = true);
    letterInput.addEventListener('compositionend', ()=> { state.composing = false; sanitizeInput(); });
    letterInput.addEventListener('input', ()=> { if (!state.composing) sanitizeInput(); });
    letterInput.addEventListener('keydown', (e)=> { if (e.key === 'Enter') { e.preventDefault(); guessBtn.click(); } if (e.key === 'Backspace') setTimeout(()=> letterInput.focus(),0); });

    function sanitizeInput(){
      const raw = (letterInput.value||'').trim();
      const normalized = normalizeFaLetter(raw.replace(/\s/g,''));
      letterInput.value = normalized.slice(0,1);
    }

    // ---------- Actions ----------
    guessBtn.addEventListener('click', () => {
      if (state.composing) return;
      const vRaw = (letterInput.value||'').trim();
      if (!vRaw || vRaw.length !== 1) { letterInput.focus(); return; }
      const v = normalizeFaLetter(vRaw);
      if (!/^[\u0600-\u06FF]$/.test(v)) { letterInput.classList.add('shake'); setTimeout(()=> letterInput.classList.remove('shake'),200); return; }
      socket.emit('game:guess', { game_id: state.gameId, user_id: state.myId, letter: v });
      letterInput.value = ''; letterInput.focus();
    });

    hintBtn.addEventListener('click', ()=> socket.emit('game:hint', { game_id: state.gameId, user_id: state.myId }));
    leaveBtn.addEventListener('click', async ()=> {
      if (!state.roomId) return;
      await fetch('/rooms/leave', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ room_id: state.roomId, user_id: state.myId })});
      resetToLobby();
    });

    function resetToLobby(){
      state.roomId = null; state.gameId = null; state.deck = []; state.gameState = null;
      document.getElementById('lobby').style.display = 'block';
      gamePanel.style.display = 'none';
    }

    // ---------- Socket handlers ----------
    socket.on('game:started', ({ game_id, deck, reveal_mode }) => {
      state.gameId = game_id; state.deck = deck || []; state.revealMode = reveal_mode || 'shared';
      revealModeLabel.textContent = 'مود: ' + (state.revealMode === 'shared' ? 'مشترک' : 'خصوصی');
      setTimeout(()=> socket.emit('game:resume', { game_id: state.gameId, user_id: state.myId }), 120);
    });

    socket.on('game:state', ({ state: gs, deck, reveal_mode, players }) => {
      state.gameState = gs; state.deck = deck || state.deck; state.revealMode = reveal_mode || state.revealMode;
      revealModeLabel.textContent = 'مود: ' + (state.revealMode === 'shared' ? 'مشترک' : 'خصوصی');
      renderGame();
      gamePanel.style.display = 'block';
      document.getElementById('lobby').style.display = 'none';
      updatePlayersList(players || []);
      setTimeout(()=> letterInput.focus(), 50);
    });

    socket.on('game:letter:correct', ({ user_id, letter, positions, scoreDelta, shared, player }) => {
      const isMe = Number(user_id) === Number(state.myId);
      positions.forEach(origIdx => {
        const dispIdx = state.indexMap[origIdx];
        if (dispIdx === null || dispIdx === undefined) return;
        const slot = wordSlots.querySelector(`.slot[data-disp-index="${dispIdx}"]`);
        if (slot){ slot.textContent = letter; slot.classList.add('revealed'); if (!isMe) slot.classList.add('opponent'); }
      });
      if (isMe && player) scoreMe.textContent = toFaDigits(player.score || 0);
      socket.emit('game:resume', { game_id: state.gameId, user_id: state.myId });
    });

    socket.on('game:letter:wrong', ({ user_id, letter }) => {
      if (Number(user_id) === Number(state.myId)) addChip(wrongLetters, letter);
    });

    socket.on('game:opponentEvent', (evt) => {
      if (evt.type === 'opponent_correct') flashMessage('حریف حرفی را حدس زد');
    });

    socket.on('game:hint:reveal', ({ user_id, letter, positions, penalty }) => {
      const isMe = Number(user_id) === Number(state.myId);
      positions.forEach(origIdx => {
        const dispIdx = state.indexMap[origIdx];
        if (dispIdx === null || dispIdx === undefined) return;
        const slot = wordSlots.querySelector(`.slot[data-disp-index="${dispIdx}"]`);
        if (slot){ slot.textContent = letter; slot.classList.add('revealed'); if (!isMe) slot.classList.add('opponent'); }
      });
      socket.emit('game:resume', { game_id: state.gameId, user_id: state.myId });
    });

    socket.on('game:next', ({ game_id }) => {
      if (state.gameId === game_id) socket.emit('game:resume', { game_id: state.gameId, user_id: state.myId });
    });

    socket.on('game:finished', ({ game_id }) => {
      if (state.gameId === game_id) { alert('بازی به پایان رسید'); resetToLobby(); }
    });

    // ---------- render ----------
    function renderGame(){
      if (!state.gameState || !state.deck || !state.deck.length) return;
      const idx = Number(state.gameState.current_index) || 0;
      const item = state.deck[idx] || { word:'', category:'', level:'medium' };
      const wordNorm = normalizeFaWordKeepSpaces(item.word);
      state.indexMap = buildIndexMap(wordNorm);

      categoryName.textContent = item.category || '';
      levelName.textContent = item.level === 'easy' ? 'آسان' : item.level === 'hard' ? 'سخت' : 'متوسط';
      wordIndex.textContent = toFaDigits(idx + 1);

      wordSlots.innerHTML = '';
      for (let i=0;i<wordNorm.length;i++){
        const ch = wordNorm[i];
        if (ch === ' ') { const g = document.createElement('div'); g.className='gap'; wordSlots.appendChild(g); }
        else { const dispIdx = state.indexMap[i]; const s = document.createElement('div'); s.className='slot'; s.dataset.dispIndex = dispIdx; s.textContent = '_'; wordSlots.appendChild(s); }
      }

      correctLetters.innerHTML = ''; wrongLetters.innerHTML = '';
      const correct = Array.isArray(state.gameState.correct_letters) ? state.gameState.correct_letters : JSON.parse(state.gameState.correct_letters || '[]');
      const wrong = Array.isArray(state.gameState.wrong_letters) ? state.gameState.wrong_letters : JSON.parse(state.gameState.wrong_letters || '[]');
      correct.forEach(l => addChip(correctLetters, l));
      wrong.forEach(l => addChip(wrongLetters, l));

      for (let origIdx=0; origIdx<wordNorm.length; origIdx++){
        const ch = wordNorm[origIdx];
        const dispIdx = state.indexMap[origIdx];
        if (dispIdx === null || dispIdx === undefined) continue;
        if (correct.includes(ch)){
          const s = wordSlots.querySelector(`.slot[data-disp-index="${dispIdx}"]`);
          if (s){ s.textContent = ch; s.classList.add('revealed'); }
        }
      }

      scoreMe.textContent = toFaDigits(Number(state.gameState.score) || 0);
      progressMe.textContent = `${toFaDigits((Number(state.gameState.current_index)||0)+1)} / ${toFaDigits(state.deck.length || 10)}`;
    }

    function addChip(container, letter){
      const c = document.createElement('div'); c.className='chip'; c.textContent = letter; container.appendChild(c);
    }

    function updatePlayersList(list){
      playersList.innerHTML = '';
      (list || []).forEach(p => {
        const row = document.createElement('div'); row.className='player-row';
        const name = document.createElement('div'); name.style.fontWeight='800'; name.textContent = p.fullname || ('#' + toFaDigits(p.user_id));
        const meta = document.createElement('div'); meta.className='muted'; meta.textContent = `امتیاز: ${toFaDigits(p.score||0)} · حدس‌ها: ${toFaDigits(p.guessed_count||0)} · ایندکس: ${toFaDigits((p.current_index||0)+1)}`;
        row.appendChild(name); row.appendChild(meta); playersList.appendChild(row);
      });
    }

    function flashMessage(s){
      const el = document.createElement('div'); el.className='panel muted'; el.style.marginTop='8px'; el.textContent = s;
      document.querySelector('.shell').insertBefore(el, document.querySelector('.shell').children[1]);
      setTimeout(()=> el.remove(), 1600);
    }

    // initial
    loadPublicRooms();
  </script>
</body>
</html>
