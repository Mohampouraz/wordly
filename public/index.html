<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly - بازی کلمه‌یابی رقابتی</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* استایل‌های کلی */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --accent-color: #ff6b6b;
            --success-color: #51cf66;
            --warning-color: #fcc419;
            --danger-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --text-color: #333;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            min-height: 100vh;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--light-color);
            margin-bottom: 20px;
        }

        .logo {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            background: var(--light-color);
            border-radius: var(--border-radius);
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: calc(var(--border-radius) - 2px);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .tab-button.active {
            background: white;
            box-shadow: var(--box-shadow);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* کارت‌های آماری */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            border-top: 4px solid var(--primary-color);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* دکمه‌های عمل */
        .quick-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-button {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            border: none;
            border-radius: var(--border-radius);
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--box-shadow);
        }

        .action-button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        /* بخش بازی رقابتی */
        .competitive-container {
            padding: 20px 0;
        }

        .room-section {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--light-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        .join-button, .create-button {
            padding: 12px 25px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .join-button {
            background: var(--success-color);
            color: white;
        }

        .create-button {
            background: var(--primary-color);
            color: white;
        }

        .waiting-room, .game-area {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
        }

        .players-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .player-card {
            padding: 15px;
            border: 2px solid var(--light-color);
            border-radius: var(--border-radius);
            min-width: 150px;
        }

        /* رابط بازی */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--light-color);
        }

        .players-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vs {
            font-weight: bold;
            color: var(--accent-color);
        }

        .game-progress {
            font-weight: 600;
        }

        .game-board {
            text-align: center;
        }

        .word-category {
            margin-bottom: 20px;
        }

        .word-category h3 {
            color: var(--primary-color);
            background: var(--light-color);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            display: inline-block;
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
            background: var(--light-color);
            padding: 15px;
            border-radius: var(--border-radius);
            display: inline-block;
        }

        .word-placeholder {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .letter-slot {
            width: 50px;
            height: 50px;
            border-bottom: 3px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .letter-slot.filled {
            border-bottom: none;
        }

        .letter-slot.correct {
            color: var(--success-color);
        }

        .input-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .input-section input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            border: 2px solid var(--light-color);
            border-radius: var(--border-radius);
        }

        .hint-section {
            margin: 20px 0;
        }

        .hint-button {
            padding: 10px 20px;
            background: var(--warning-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
        }

        .letters-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .correct-letters, .wrong-letters {
            text-align: center;
        }

        .correct-letters h4, .wrong-letters h4 {
            margin-bottom: 10px;
        }

        .letters-container {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 40px;
        }

        .letter-badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .correct-letter {
            background: var(--success-color);
            color: white;
        }

        .wrong-letter {
            background: var(--danger-color);
            color: white;
        }

        /* پروفایل */
        .profile-container {
            padding: 20px 0;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary-color);
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .profile-stat {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            justify-content: space-between;
        }

        /* مودال */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--box-shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--light-color);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        /* کلاس‌های کمکی */
        .hidden {
            display: none !important;
        }

        /* واکنش‌گرایی */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            .quick-actions {
                flex-direction: column;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .players-list {
                flex-direction: column;
                align-items: center;
            }
            
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .letters-section {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- هدر -->
        <header class="header">
            <h1 class="logo">Wordly</h1>
            <div class="user-info">
                <span id="username">کاربر</span>
                <span id="user-score">امتیاز: 0</span>
            </div>
        </header>

        <!-- تب‌های اصلی -->
        <div class="tabs">
            <button class="tab-button active" data-tab="dashboard">داشبورد</button>
            <button class="tab-button" data-tab="competitive">بازی رقابتی</button>
            <button class="tab-button" data-tab="profile">پروفایل</button>
        </div>

        <!-- محتوای تب‌ها -->
        <div class="tab-content">
            <!-- داشبورد -->
            <div id="dashboard" class="tab-pane active">
                <div class="stats-container">
                    <div class="stat-card">
                        <h3>امتیاز کلی</h3>
                        <p id="total-score">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>بازی‌های انجام شده</h3>
                        <p id="games-played">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>بردها</h3>
                        <p id="games-won">0</p>
                    </div>
                </div>
                <div class="quick-actions">
                    <button id="quick-play" class="action-button">شروع بازی سریع</button>
                    <button id="create-room" class="action-button">ایجاد اتاق بازی</button>
                </div>
            </div>

            <!-- بازی رقابتی -->
            <div id="competitive" class="tab-pane">
                <div class="competitive-container">
                    <div class="room-section">
                        <h2>پیوستن به اتاق بازی</h2>
                        <div class="input-group">
                            <input type="text" id="room-code" placeholder="کد اتاق" maxlength="6">
                            <button id="join-room" class="join-button">پیوستن</button>
                        </div>
                        <button id="create-new-room" class="create-button">ایجاد اتاق جدید</button>
                    </div>
                    
                    <div id="waiting-room" class="waiting-room hidden">
                        <h3>اتاق بازی: <span id="current-room-code"></span></h3>
                        <p>در انتظار بازیکن دوم...</p>
                        <div class="players-list">
                            <div class="player-card" id="player1-card">
                                <span>بازیکن 1: <span id="player1-name">...</span></span>
                            </div>
                            <div class="player-card" id="player2-card">
                                <span>بازیکن 2: <span id="player2-name">در انتظار...</span></span>
                            </div>
                        </div>
                    </div>

                    <div id="game-area" class="game-area hidden">
                        <!-- محتوای بازی در اینجا قرار می‌گیرد -->
                    </div>
                </div>
            </div>

            <!-- پروفایل -->
            <div id="profile" class="tab-pane">
                <div class="profile-container">
                    <div class="profile-header">
                        <div class="avatar" id="profile-avatar">U</div>
                        <h2 id="profile-name">نام کاربر</h2>
                    </div>
                    <div class="profile-stats">
                        <div class="profile-stat">
                            <span>رتبه:</span>
                            <span id="profile-rank">-</span>
                        </div>
                        <div class="profile-stat">
                            <span>میانگین امتیاز:</span>
                            <span id="profile-avg-score">0</span>
                        </div>
                        <div class="profile-stat">
                            <span>نرخ برد:</span>
                            <span id="profile-win-rate">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال‌ها -->
    <div id="game-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>بازی رقابتی</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <!-- محتوای بازی اینجا قرار می‌گیرد -->
            </div>
        </div>
    </div>

    <script>
        // پایگاه داده کلمات
        const wordsDatabase = {
            "آسان": [
                {
                    category: "میوه‌ها",
                    words: ["سیب", "پرتقال", "موز", "انگور", "هلو", "گیلاس", "انار", "انجیر", "خربزه"]
                },
                {
                    category: "حیوانات",
                    words: ["سگ", "گربه", "موش", "مرغ", "خرگوش", "گوسفند", "گاو", "اسب", "ماهی"]
                },
                {
                    category: "وسایل نقلیه",
                    words: ["ماشین", "قطار", "کشتی", "هواپیما", "دوچرخه", "موتور", "اتوبوس", "مترو", "ون"]
                }
            ],
            "متوسط": [
                {
                    category: "شهرهای ایران",
                    words: ["تهران", "مشهد", "اصفهان", "شیراز", "تبریز", "کرج", "قم", "اهواز", "کرمانشاه"]
                },
                {
                    category: "کشورها",
                    words: ["ایران", "ترکیه", "آلمان", "فرانسه", "ایتالیا", "ژاپن", "چین", "روسیه", "کانادا"]
                },
                {
                    category: "رشته‌های تحصیلی",
                    words: ["مهندسی", "پزشکی", "حقوق", "روانشناسی", "مدیریت", "کامپیوتر", "معماری", "حسابداری", "شیمی"]
                }
            ],
            "سخت": [
                {
                    category: "دانشمندان",
                    words: ["ابوریحان", "خیام", "زکریا", "انیشتین", "نیوتن", "داوینچی", "گالیله", "پاستور", "کپلر"]
                },
                {
                    category: "مفاهیم فلسفی",
                    words: ["وجودشناسی", "معرفت‌شناسی", "اخلاق", "منطق", "زیبایی‌شناسی", "متافیزیک", "دیالکتیک", "پدیدارشناسی", "اگزیستانسیالیسم"]
                },
                {
                    category: "عناصر شیمیایی",
                    words: ["هیدروژن", "اکسیژن", "نیتروژن", "کربن", "آهن", "طلا", "نقره", "مس", "جیوه"]
                }
            ]
        };

        // متغیرهای جهانی
        let tg = window.Telegram.WebApp;
        let socket = null;
        let currentUser = null;
        let currentRoom = null;
        let gameState = null;
        let timerInterval = null;
        let timeLeft = 60;

        // مقداردهی اولیه برنامه
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            setupEventListeners();
        });

        // مقداردهی اولیه برنامه
        function initializeApp() {
            // تنظیمات اولیه تلگرام وب‌اپ
            if (typeof tg !== 'undefined') {
                tg.expand();
                tg.enableClosingConfirmation();
                
                // دریافت اطلاعات کاربر از تلگرام
                const initData = tg.initDataUnsafe;
                if (initData && initData.user) {
                    currentUser = {
                        id: initData.user.id,
                        username: initData.user.username,
                        firstName: initData.user.first_name,
                        lastName: initData.user.last_name
                    };
                    updateUserInfo();
                } else {
                    // حالت تست (زمانی که در محیط تلگرام نیستیم)
                    currentUser = {
                        id: Math.floor(Math.random() * 10000),
                        username: "testuser",
                        firstName: "کاربر",
                        lastName: "تست"
                    };
                    updateUserInfo();
                }
            } else {
                // حالت تست (زمانی که در محیط تلگرام نیستیم)
                currentUser = {
                    id: Math.floor(Math.random() * 10000),
                    username: "testuser",
                    firstName: "کاربر",
                    lastName: "تست"
                };
                updateUserInfo();
            }
            
            // اتصال به Socket.IO
            socket = io();
            
            // تنظیم هندلرهای Socket.IO
            setupSocketHandlers();
        }

        // تنظیم هندلرهای رویداد
        function setupEventListeners() {
            // هندلرهای تب‌ها
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });
            
            // هندلرهای بازی رقابتی
            document.getElementById('join-room').addEventListener('click', joinRoom);
            document.getElementById('create-new-room').addEventListener('click', createNewRoom);
            document.getElementById('quick-play').addEventListener('click', quickPlay);
            document.getElementById('create-room').addEventListener('click', createNewRoom);
            
            // هندلر مودال
            document.querySelector('.close-modal').addEventListener('click', closeModal);
        }

        // تنظیم هندلرهای Socket.IO
        function setupSocketHandlers() {
            socket.on('room-joined', (data) => {
                currentRoom = data.roomCode;
                showWaitingRoom(data.roomCode);
            });
            
            socket.on('room-rejoined', (data) => {
                currentRoom = data.roomCode;
                // بازیابی وضعیت بازی
            });
            
            socket.on('room-full', (data) => {
                alert('اتاق بازی پر است. لطفاً اتاق دیگری انتخاب کنید.');
            });
            
            socket.on('game-started', (data) => {
                hideWaitingRoom();
                startGame(data);
            });
            
            socket.on('letter-guessed', (data) => {
                updateGameState(data);
            });
            
            socket.on('game-state-update', (data) => {
                updateGameDisplay(data);
            });
            
            socket.on('error', (data) => {
                alert(data.message);
            });
        }

        // تغییر تب
        function switchTab(tabName) {
            // غیرفعال کردن همه تب‌ها
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            
            // فعال کردن تب انتخاب شده
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // به روزرسانی اطلاعات کاربر
        function updateUserInfo() {
            if (currentUser) {
                const username = currentUser.username || 
                                `${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                
                document.getElementById('username').textContent = username;
                document.getElementById('profile-name').textContent = username;
                
                // ایجاد آواتار بر اساس حرف اول نام
                const firstLetter = currentUser.firstName ? currentUser.firstName.charAt(0) : 'U';
                document.getElementById('profile-avatar').textContent = firstLetter;
            }
        }

        // پیوستن به اتاق
        function joinRoom() {
            const roomCode = document.getElementById('room-code').value.trim().toUpperCase();
            
            if (!roomCode) {
                alert('لطفاً کد اتاق را وارد کنید');
                return;
            }
            
            if (!currentUser) {
                alert('خطا در شناسایی کاربر');
                return;
            }
            
            socket.emit('join-room', {
                roomCode: roomCode,
                userData: currentUser
            });
        }

        // ایجاد اتاق جدید
        function createNewRoom() {
            const roomCode = generateRoomCode();
            document.getElementById('room-code').value = roomCode;
            joinRoom();
        }

        // تولید کد اتاق تصادفی
        function generateRoomCode() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // نمایش اتاق انتظار
        function showWaitingRoom(roomCode) {
            document.getElementById('current-room-code').textContent = roomCode;
            document.getElementById('player1-name').textContent = currentUser.username || 'بازیکن 1';
            document.getElementById('waiting-room').classList.remove('hidden');
        }

        // مخفی کردن اتاق انتظار
        function hideWaitingRoom() {
            document.getElementById('waiting-room').classList.add('hidden');
        }

        // شروع بازی
        function startGame(gameData) {
            // نمایش رابط بازی
            showGameInterface(gameData);
            
            // شروع تایمر
            startTimer();
        }

        // نمایش رابط بازی
        function showGameInterface(gameData) {
            const gameArea = document.getElementById('game-area');
            gameArea.classList.remove('hidden');
            
            // انتخاب کلمات تصادفی برای بازی
            const words = getRandomWords("متوسط", 10);
            
            // ذخیره وضعیت بازی
            gameState = {
                player1: gameData.player1,
                player2: gameData.player2,
                words: words,
                currentWordIndex: 0,
                guessedLetters: [],
                wrongLetters: [],
                hintsUsed: 0,
                maxHints: 2,
                scores: {
                    player1: 0,
                    player2: 0
                }
            };
            
            // ایجاد رابط بازی
            gameArea.innerHTML = `
                <div class="game-header">
                    <div class="players-info">
                        <div class="player-info">
                            <span>${gameData.player1.username || 'بازیکن 1'}</span>
                            <span class="score">امتیاز: <span id="player1-score">0</span></span>
                        </div>
                        <div class="vs">VS</div>
                        <div class="player-info">
                            <span>${gameData.player2.username || 'بازیکن 2'}</span>
                            <span class="score">امتیاز: <span id="player2-score">0</span></span>
                        </div>
                    </div>
                    <div class="game-progress">
                        <span>کلمه: <span id="current-word-index">1</span>/10</span>
                    </div>
                </div>
                
                <div class="game-board">
                    <div class="word-category">
                        <h3 id="category-name">${words[0].category}</h3>
                    </div>
                    
                    <div class="timer">
                        <span id="timer-display">۶۰</span>
                    </div>
                    
                    <div class="word-placeholder" id="word-placeholder">
                        <!-- حروف کلمه اینجا نمایش داده می‌شوند -->
                    </div>
                    
                    <div class="input-section">
                        <input type="text" id="letter-input" maxlength="1" placeholder="حرف را وارد کنید" autocomplete="off">
                        <button id="submit-guess">حدس بزن</button>
                    </div>
                    
                    <div class="hint-section">
                        <button id="use-hint" class="hint-button">راهنمایی (${gameState.maxHints - gameState.hintsUsed})</button>
                    </div>
                    
                    <div class="letters-section">
                        <div class="correct-letters">
                            <h4>حروف صحیح</h4>
                            <div class="letters-container" id="correct-letters-list"></div>
                        </div>
                        <div class="wrong-letters">
                            <h4>حروف غلط</h4>
                            <div class="letters-container" id="wrong-letters-list"></div>
                        </div>
                    </div>
                </div>
            `;
            
            // نمایش کلمه اول
            displayCurrentWord();
            
            // اضافه کردن هندلرهای بازی
            setupGameHandlers();
        }

        // نمایش کلمه فعلی
        function displayCurrentWord() {
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            const wordPlaceholder = document.getElementById('word-placeholder');
            wordPlaceholder.innerHTML = '';
            
            for (let i = 0; i < currentWord.length; i++) {
                const letterSlot = document.createElement('div');
                letterSlot.className = 'letter-slot';
                letterSlot.id = `letter-slot-${i}`;
                
                // اگر حرف قبلاً حدس زده شده، نمایش داده شود
                if (gameState.guessedLetters.includes(currentWord[i])) {
                    letterSlot.textContent = currentWord[i];
                    letterSlot.classList.add('filled', 'correct');
                }
                
                wordPlaceholder.appendChild(letterSlot);
            }
            
            // به روزرسانی نمایش حروف صحیح و غلط
            updateLettersDisplay();
            
            // به روزرسانی شماره کلمه فعلی
            document.getElementById('current-word-index').textContent = gameState.currentWordIndex + 1;
        }

        // به روزرسانی نمایش حروف
        function updateLettersDisplay() {
            const correctLettersList = document.getElementById('correct-letters-list');
            const wrongLettersList = document.getElementById('wrong-letters-list');
            
            correctLettersList.innerHTML = '';
            wrongLettersList.innerHTML = '';
            
            gameState.guessedLetters.forEach(letter => {
                const letterBadge = document.createElement('span');
                letterBadge.className = 'letter-badge correct-letter';
                letterBadge.textContent = letter;
                correctLettersList.appendChild(letterBadge);
            });
            
            gameState.wrongLetters.forEach(letter => {
                const letterBadge = document.createElement('span');
                letterBadge.className = 'letter-badge wrong-letter';
                letterBadge.textContent = letter;
                wrongLettersList.appendChild(letterBadge);
            });
        }

        // تنظیم هندلرهای بازی
        function setupGameHandlers() {
            document.getElementById('submit-guess').addEventListener('click', submitGuess);
            document.getElementById('letter-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitGuess();
                }
            });
            
            document.getElementById('use-hint').addEventListener('click', useHint);
            
            // محدود کردن ورودی به حروف فارسی
            document.getElementById('letter-input').addEventListener('input', function(e) {
                if (!isPersianLetter(e.target.value)) {
                    e.target.value = '';
                }
            });
        }

        // ارسال حدس
        function submitGuess() {
            const letterInput = document.getElementById('letter-input');
            const letter = letterInput.value.trim();
            
            if (!letter || !isPersianLetter(letter)) {
                alert('لطفاً یک حرف فارسی معتبر وارد کنید');
                return;
            }
            
            // بررسی تکراری نبودن حرف
            if (gameState.guessedLetters.includes(letter) || gameState.wrongLetters.includes(letter)) {
                alert('این حرف قبلاً حدس زده شده است');
                letterInput.value = '';
                return;
            }
            
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            
            // بررسی صحیح بودن حدس
            if (currentWord.includes(letter)) {
                // حرف صحیح
                gameState.guessedLetters.push(letter);
                
                // به روزرسانی نمایش کلمه
                updateWordDisplay();
                
                // بررسی کامل شدن کلمه
                if (isWordComplete()) {
                    handleWordComplete();
                }
            } else {
                // حرف غلط
                gameState.wrongLetters.push(letter);
                
                // بررسی پایان خطاها
                const maxWrongGuesses = Math.floor(currentWord.length * 1.2);
                if (gameState.wrongLetters.length >= maxWrongGuesses) {
                    handleMaxWrongGuesses();
                }
            }
            
            // به روزرسانی نمایش حروف
            updateLettersDisplay();
            
            // ارسال به سرور (در حالت چندنفره)
            socket.emit('guess-letter', {
                roomCode: currentRoom,
                letter: letter,
                userId: currentUser.id
            });
            
            letterInput.value = '';
            letterInput.focus();
        }

        // به روزرسانی نمایش کلمه
        function updateWordDisplay() {
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            
            for (let i = 0; i < currentWord.length; i++) {
                const letterSlot = document.getElementById(`letter-slot-${i}`);
                if (gameState.guessedLetters.includes(currentWord[i])) {
                    letterSlot.textContent = currentWord[i];
                    letterSlot.classList.add('filled', 'correct');
                }
            }
        }

        // بررسی کامل شدن کلمه
        function isWordComplete() {
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            
            for (let i = 0; i < currentWord.length; i++) {
                if (!gameState.guessedLetters.includes(currentWord[i])) {
                    return false;
                }
            }
            
            return true;
        }

        // مدیریت کامل شدن کلمه
        function handleWordComplete() {
            // محاسبه امتیاز
            const score = calculateScore();
            
            // به روزرسانی امتیاز بازیکن
            if (currentUser.id === gameState.player1.id) {
                gameState.scores.player1 += score;
                document.getElementById('player1-score').textContent = gameState.scores.player1;
            } else {
                gameState.scores.player2 += score;
                document.getElementById('player2-score').textContent = gameState.scores.player2;
            }
            
            // رفتن به کلمه بعدی یا پایان بازی
            setTimeout(() => {
                nextWord();
            }, 1500);
        }

        // مدیریت بیشینه حدس‌های غلط
        function handleMaxWrongGuesses() {
            alert(`حدس‌های غلط شما به پایان رسید! کلمه "${gameState.words[gameState.currentWordIndex].word}" بود.`);
            nextWord();
        }

        // رفتن به کلمه بعدی
        function nextWord() {
            gameState.currentWordIndex++;
            
            if (gameState.currentWordIndex >= gameState.words.length) {
                // پایان بازی
                endGame();
            } else {
                // بازنشانی وضعیت برای کلمه جدید
                gameState.guessedLetters = [];
                gameState.wrongLetters = [];
                
                // به روزرسانی دسته‌بندی
                document.getElementById('category-name').textContent = 
                    gameState.words[gameState.currentWordIndex].category;
                
                // نمایش کلمه جدید
                displayCurrentWord();
                
                // بازنشانی تایمر
                resetTimer();
            }
        }

        // محاسبه امتیاز
        function calculateScore() {
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            const baseScore = currentWord.length * 10;
            const timeBonus = Math.floor(timeLeft * 0.5);
            const hintPenalty = gameState.hintsUsed * 15;
            
            return Math.max(baseScore + timeBonus - hintPenalty, 0);
        }

        // استفاده از راهنمایی
        function useHint() {
            if (gameState.hintsUsed >= gameState.maxHints) {
                alert('شما تمام راهنمایی‌های خود را استفاده کرده‌اید');
                return;
            }
            
            const currentWord = gameState.words[gameState.currentWordIndex].word;
            let hiddenLetters = [];
            
            // پیدا کردن حروفی که هنوز حدس زده نشده‌اند
            for (let i = 0; i < currentWord.length; i++) {
                if (!gameState.guessedLetters.includes(currentWord[i])) {
                    hiddenLetters.push(i);
                }
            }
            
            if (hiddenLetters.length === 0) {
                alert('همه حروف قبلاً حدس زده شده‌اند');
                return;
            }
            
            // انتخاب یک حرف تصادفی برای نمایش
            const randomIndex = hiddenLetters[Math.floor(Math.random() * hiddenLetters.length)];
            const hintLetter = currentWord[randomIndex];
            
            // افزودن حرف به حروف حدس زده شده
            if (!gameState.guessedLetters.includes(hintLetter)) {
                gameState.guessedLetters.push(hintLetter);
            }
            
            // به روزرسانی نمایش
            updateWordDisplay();
            updateLettersDisplay();
            
            // افزایش تعداد راهنمایی‌های استفاده شده
            gameState.hintsUsed++;
            document.getElementById('use-hint').textContent = 
                `راهنمایی (${gameState.maxHints - gameState.hintsUsed})`;
            
            // بررسی کامل شدن کلمه
            if (isWordComplete()) {
                handleWordComplete();
            }
        }

        // شروع تایمر
        function startTimer() {
            timeLeft = 60;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeUp();
                }
            }, 1000);
        }

        // به روزرسانی نمایش تایمر
        function updateTimerDisplay() {
            const timerDisplay = document.getElementById('timer-display');
            if (timerDisplay) {
                timerDisplay.textContent = convertToPersianNumbers(timeLeft);
            }
        }

        // بازنشانی تایمر
        function resetTimer() {
            clearInterval(timerInterval);
            startTimer();
        }

        // مدیریت اتمام زمان
        function handleTimeUp() {
            alert('زمان شما به پایان رسید!');
            nextWord();
        }

        // پایان بازی
        function endGame() {
            const gameArea = document.getElementById('game-area');
            
            let winnerText = '';
            if (gameState.scores.player1 > gameState.scores.player2) {
                winnerText = `${gameState.player1.username || 'بازیکن 1'} برنده شد!`;
            } else if (gameState.scores.player2 > gameState.scores.player1) {
                winnerText = `${gameState.player2.username || 'بازیکن 2'} برنده شد!`;
            } else {
                winnerText = 'بازی مساوی شد!';
            }
            
            gameArea.innerHTML = `
                <div class="game-result">
                    <h2>پایان بازی!</h2>
                    <p>${winnerText}</p>
                    <div class="final-scores">
                        <p>${gameState.player1.username || 'بازیکن 1'}: ${gameState.scores.player1} امتیاز</p>
                        <p>${gameState.player2.username || 'بازیکن 2'}: ${gameState.scores.player2} امتیاز</p>
                    </div>
                    <button id="play-again" class="action-button">بازی مجدد</button>
                </div>
            `;
            
            document.getElementById('play-again').addEventListener('click', () => {
                location.reload();
            });
        }

        // به‌روزرسانی وضعیت بازی (برای حالت چندنفره)
        function updateGameState(data) {
            // این تابع وضعیت بازی را بر اساس داده‌های دریافتی از سرور به‌روزرسانی می‌کند
        }

        // به‌روزرسانی نمایش بازی
        function updateGameDisplay(data) {
            // این تابع رابط کاربری را بر اساس داده‌های دریافتی از سرور به‌روزرسانی می‌کند
        }

        // بررسی حرف فارسی
        function isPersianLetter(char) {
            const persianRegex = /[\u0600-\u06FF]/;
            return persianRegex.test(char);
        }

        // تبدیل اعداد به فارسی
        function convertToPersianNumbers(number) {
            const persianNumbers = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return number.toString().replace(/\d/g, digit => persianNumbers[parseInt(digit)]);
        }

        // دریافت کلمات تصادفی
        function getRandomWords(difficulty, count = 10) {
            const difficultyWords = wordsDatabase[difficulty];
            if (!difficultyWords) return [];
            
            const selectedWords = [];
            const usedCategories = new Set();
            
            while (selectedWords.length < count && usedCategories.size < difficultyWords.length) {
                const randomCategoryIndex = Math.floor(Math.random() * difficultyWords.length);
                
                if (!usedCategories.has(randomCategoryIndex)) {
                    usedCategories.add(randomCategoryIndex);
                    const category = difficultyWords[randomCategoryIndex];
                    const randomWordIndex = Math.floor(Math.random() * category.words.length);
                    
                    selectedWords.push({
                        word: category.words[randomWordIndex],
                        category: category.category
                    });
                }
            }
            
            return selectedWords;
        }

        // بازی سریع
        function quickPlay() {
            createNewRoom();
        }

        // بستن مودال
        function closeModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }
    </script>
</body>
