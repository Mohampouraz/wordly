<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wordly — Mini WebApp</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body dir="rtl">
  <div class="app-shell">
    <header class="topbar">
      <h1>خوش آمدید به Wordly</h1>
      <p class="subtitle">اپ حرفه‌ای درون تلگرام — نمایش اطلاعات کاربر و تاریخ شمسی</p>
    </header>

    <main class="card">
      <div class="welcome">
        <img class="logo" src="/logo.svg" alt="Wordly" onerror="this.style.display='none'"/>
        <h2 id="greeting">سلام!</h2>
        <p id="intro">برای نمایش اطلاعات کاربری روی دکمه زیر کلیک کنید.</p>

        <div class="actions">
          <button id="btnShowAll" class="btn">نمایش اطلاعات من</button>
          <button id="btnClose" class="btn ghost">بستن وب‌اپ</button>
        </div>
      </div>

      <div id="modals"></div>
    </main>

    <footer class="footer">© Wordly — طراحی شده برای Telegram Web Apps</footer>
  </div>

  <script src="/script.js"></script>
</body>
</html>
