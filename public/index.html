<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Arena | بازی آنلاین حرفه‌ای</title>
    
    <!-- اسکریپت تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- استایل‌ها -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, #eab308 100%);
        }
        
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px 20px;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
            transform: translateY(-1px);
        }
        
        .nav-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes modalAppear {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .debug-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 300px;
            z-index: 9999;
        }
        
        .game-card {
            transition: all 0.3s ease;
        }
        
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .status-waiting {
            background: linear-gradient(135deg, #f59e0b 0%, #eab308 100%);
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .status-finished {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        
        .word-display {
            letter-spacing: 8px;
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .keyboard-btn {
            transition: all 0.2s ease;
            min-width: 50px;
            height: 50px;
            font-size: 1.2rem;
        }
        
        .keyboard-btn:active {
            transform: scale(0.95);
        }
        
        .correct-guess {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .incorrect-guess {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <!-- پنل دیباگ -->
    <div id="debugPanel" class="debug-panel hidden">
        <div class="font-bold mb-2">🔧 دیباگ اطلاعات:</div>
        <div id="debugInfo"></div>
    </div>

    <!-- Floating Notification -->
    <div id="floatingNotification" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-white rounded-2xl p-4 shadow-2xl max-w-sm">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fas fa-bell text-yellow-500 text-xl" id="notificationIcon"></i>
                <div>
                    <p class="font-bold text-gray-800" id="notificationTitle">اعلان</p>
                    <p class="text-sm text-gray-600" id="notificationMessage">پیام</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="glass-effect rounded-3xl p-8 mb-6">
                <div class="flex items-center justify-center space-x-4 space-x-reverse mb-4">
                    <i class="fas fa-ghost text-5xl text-white"></i>
                    <h1 class="text-4xl font-black text-white">Wordly Arena</h1>
                </div>
                <p class="text-white/80 text-lg">🎯 بازی حدس کلمه آنلاین حرفه‌ای</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="glass-effect rounded-2xl p-4 mb-8">
            <div class="flex flex-wrap justify-center gap-3">
                <button class="nav-btn active bg-white text-gray-800" onclick="showTab('dashboard')">
                    <i class="fas fa-home ml-2"></i>داشبورد
                </button>
                <button class="nav-btn bg-white/20 text-white" onclick="showTab('create-game')">
                    <i class="fas fa-plus-circle ml-2"></i>ایجاد بازی
                </button>
                <button class="nav-btn bg-white/20 text-white" onclick="showTab('join-game')">
                    <i class="fas fa-link ml-2"></i>پیوستن
                </button>
                <button class="nav-btn bg-white/20 text-white" onclick="showTab('active-games')">
                    <i class="fas fa-gamepad ml-2"></i>بازی‌های من
                </button>
                <button class="nav-btn bg-white/20 text-white" onclick="showTab('available-games')">
                    <i class="fas fa-users ml-2"></i>بازی‌های موجود
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="glass-card rounded-3xl p-6 mb-8 relative min-h-96">
            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="hidden absolute inset-0 bg-white/95 rounded-3xl flex items-center justify-center z-50">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin text-5xl text-blue-500 mb-4"></i>
                    <p class="text-gray-600 font-semibold">در حال بارگذاری...</p>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboard-tab" class="tab-content">
                <!-- محتوای داشبورد -->
            </div>

            <!-- Create Game Tab -->
            <div id="create-game-tab" class="tab-content hidden">
                <!-- محتوای ایجاد بازی -->
            </div>

            <!-- Join Game Tab -->
            <div id="join-game-tab" class="tab-content hidden">
                <h2 class="text-3xl font-black text-center text-gray-800 mb-8">
                    🤝 پیوستن به بازی
                </h2>
                
                <div class="max-w-md mx-auto text-center">
                    <div class="glass-card rounded-2xl p-8 mb-8">
                        <i class="fas fa-users text-6xl text-green-400 mb-4"></i>
                        <p class="text-gray-600 text-lg">کد بازی را از دوست خود دریافت کرده و وارد کنید</p>
                    </div>
                    
                    <div class="glass-card rounded-2xl p-6 mb-6">
                        <input type="text" id="joinGameCode" 
                               class="input-field w-full text-center text-3xl font-mono tracking-widest" 
                               placeholder="XXXXXX" maxlength="6" />
                    </div>
                    
                    <button onclick="joinGame()" class="btn-primary w-full py-4 rounded-2xl text-white font-black text-xl">
                        <i class="fas fa-sign-in-alt ml-3"></i>پیوستن به بازی
                    </button>
                </div>
                
                <div id="joinGameMessage" class="hidden mt-6 p-4 rounded-2xl text-center"></div>
            </div>

            <!-- Active Games Tab -->
            <div id="active-games-tab" class="tab-content hidden">
                <!-- محتوای بازی‌های فعال -->
            </div>

            <!-- Available Games Tab -->
            <div id="available-games-tab" class="tab-content hidden">
                <!-- محتوای بازی‌های موجود -->
            </div>

            <!-- Game Play Tab -->
            <div id="game-play-tab" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black text-gray-800">🎯 بازی در جریان</h2>
                    <button onclick="showTab('active-games')" class="btn-secondary px-6 py-3 rounded-2xl text-white font-black">
                        <i class="fas fa-arrow-right ml-2"></i>بازگشت
                    </button>
                </div>
                
                <div id="gamePlayContent" class="game-container">
                    <!-- محتوای بازی در اینجا بارگذاری می‌شود -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // متغیرهای سراسری
        let userId = '';
        let fullName = '';
        let currentActiveGameCode = null;
        let currentGameData = null;
        const API_BASE_URL = window.location.origin;

        // تابع دیباگ
        function debugLog(message, data = null) {
            console.log(`🔍 ${message}`, data || '');
            updateDebugInfo(message, data);
        }

        function updateDebugInfo(message, data = null) {
            const debugInfo = document.getElementById('debugInfo');
            if (debugInfo) {
                const time = new Date().toLocaleTimeString();
                let info = `[${time}] ${message}`;
                if (data) {
                    info += `: ${JSON.stringify(data).substring(0, 100)}`;
                }
                debugInfo.innerHTML = info + '<br>' + debugInfo.innerHTML;
            }
        }

        function toggleDebug() {
            const panel = document.getElementById('debugPanel');
            panel.classList.toggle('hidden');
        }

        // مدیریت تلگرام Web App
        function initTelegramWebApp() {
            debugLog('در حال راه‌اندازی تلگرام Web App...');
            
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                debugLog('✅ Telegram Web App تشخیص داده شد');
                
                try {
                    tg.ready();
                    tg.expand();
                    
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        const user = tg.initDataUnsafe.user;
                        userId = user.id.toString();
                        fullName = user.first_name || '';
                        if (user.last_name) {
                            fullName += ' ' + user.last_name;
                        }
                        
                        debugLog('✅ کاربر از تلگرام شناسایی شد', { userId, fullName });
                        
                        document.getElementById('userNameDisplay').textContent = fullName;
                        document.getElementById('userStatus').textContent = 'اتصال موفق - آماده برای بازی!';
                        
                    } else {
                        debugLog('⚠️ داده‌های کاربر در تلگرام موجود نیست');
                        setupFallbackUser('تلگرام');
                    }
                    
                } catch (error) {
                    console.error('❌ خطا در راه‌اندازی تلگرام:', error);
                    setupFallbackUser('تلگرام-خطا');
                }
                
            } else {
                debugLog('❌ Telegram Web App در دسترس نیست');
                setupFallbackUser('مرورگر');
            }
        }

        function setupFallbackUser(source) {
            userId = 'web_user_' + Math.random().toString(36).substr(2, 9);
            fullName = 'کاربر مهمان';
            
            document.getElementById('userNameDisplay').textContent = fullName;
        }

        // توابع کمکی
        function showLoading() {
            document.getElementById('loadingSpinner').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingSpinner').classList.add('hidden');
        }

        function showMessage(elementId, message, className = 'bg-blue-100 text-blue-800 border border-blue-200') {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = message;
                element.className = `p-4 rounded-2xl text-center ${className}`;
                element.classList.remove('hidden');
                
                setTimeout(() => {
                    element.classList.add('hidden');
                }, 5000);
            }
        }

        function showNotification(title, message, type = 'info') {
            const notification = document.getElementById('floatingNotification');
            const titleEl = document.getElementById('notificationTitle');
            const messageEl = document.getElementById('notificationMessage');
            const iconEl = document.getElementById('notificationIcon');
            
            titleEl.textContent = title;
            messageEl.textContent = message;
            
            const colors = {
                info: 'text-blue-500',
                success: 'text-green-500',
                warning: 'text-yellow-500',
                error: 'text-red-500'
            };
            
            const icons = {
                info: 'fa-info-circle',
                success: 'fa-check-circle',
                warning: 'fa-exclamation-triangle',
                error: 'fa-times-circle'
            };
            
            iconEl.className = `fas ${icons[type]} text-xl ${colors[type]}`;
            notification.classList.remove('hidden');
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 4000);
        }

        // مدیریت تب‌ها
        function showTab(tabName) {
            debugLog('تغییر تب به:', tabName);
            
            // پنهان کردن همه تب‌ها
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // به‌روزرسانی دکمه‌های ناوبری
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('bg-white/20', 'text-white');
            });
            
            // نمایش تب انتخاب شده
            const targetTab = document.getElementById(`${tabName}-tab`);
            if (targetTab) {
                targetTab.classList.remove('hidden');
            }
            
            // فعال کردن دکمه مربوطه
            const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => 
                btn.getAttribute('onclick')?.includes(`showTab('${tabName}')`)
            );
            
            if (activeBtn) {
                activeBtn.classList.remove('bg-white/20', 'text-white');
                activeBtn.classList.add('active', 'bg-white', 'text-gray-800');
            }
        }

        // پیوستن به بازی - نسخه اصلاح شده
        async function joinGame() {
            const gameCode = document.getElementById('joinGameCode').value.trim().toUpperCase();

            if (!gameCode || gameCode.length !== 6) {
                showNotification('خطا', 'لطفاً کد بازی ۶ رقمی وارد کنید', 'error');
                return;
            }

            showLoading();
            try {
                debugLog('پیوستن به بازی...', { gameCode, playerId: userId });
                
                const response = await fetch(`${API_BASE_URL}/api/game/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        gameCode, 
                        playerId: userId,
                        playerName: fullName 
                    })
                });

                if (!response.ok) {
                    throw new Error(`خطای سرور: ${response.status}`);
                }

                const data = await response.json();
                debugLog('پاسخ پیوستن:', data);

                if (data.success) {
                    showNotification('موفقیت', 'با موفقیت به بازی پیوستید!', 'success');
                    currentActiveGameCode = gameCode;
                    
                    document.getElementById('joinGameCode').value = '';
                    
                    // نمایش مستقیم صفحه بازی با داده‌های دریافتی
                    if (data.gameData) {
                        currentGameData = data.gameData;
                        renderGamePlay(data.gameData);
                        showTab('game-play-tab');
                    } else {
                        // اگر داده بازی مستقیم نیامد، از API بازی را بگیر
                        await loadGamePlay(gameCode);
                    }
                    
                } else {
                    showNotification('خطا', data.message || 'خطا در پیوستن به بازی', 'error');
                    showMessage('joinGameMessage', data.message || 'خطا در پیوستن به بازی', 'bg-red-100 text-red-800 border border-red-200');
                }
            } catch (error) {
                console.error('❌ خطا در پیوستن به بازی:', error);
                showNotification('خطا', 'خطا در ارتباط با سرور', 'error');
                showMessage('joinGameMessage', 'خطا در ارتباط با سرور', 'bg-red-100 text-red-800 border border-red-200');
            } finally {
                hideLoading();
            }
        }

        // بارگذاری صفحه بازی - نسخه اصلاح شده
        async function loadGamePlay(gameCode) {
            showLoading();
            try {
                debugLog('در حال بارگذاری صفحه بازی...', { gameCode });
                
                const response = await fetch(`${API_BASE_URL}/api/game/${gameCode}?userId=${encodeURIComponent(userId)}`);
                
                if (!response.ok) {
                    throw new Error(`خطای سرور: ${response.status}`);
                }

                const data = await response.json();
                debugLog('پاسخ اطلاعات بازی:', data);

                if (data.success) {
                    currentGameData = data.gameData;
                    currentActiveGameCode = gameCode;
                    
                    renderGamePlay(data.gameData);
                    showTab('game-play-tab');
                    
                } else {
                    showNotification('خطا', data.message || 'خطا در بارگذاری بازی', 'error');
                }
            } catch (error) {
                console.error('❌ خطا در بارگذاری بازی:', error);
                showNotification('خطا', 'خطا در بارگذاری بازی', 'error');
                debugLog('خطای کامل:', error.message);
            } finally {
                hideLoading();
            }
        }

        // رندر صفحه بازی - نسخه بهبود یافته
        function renderGamePlay(gameData) {
            const gamePlayContent = document.getElementById('gamePlayContent');
            
            if (!gameData) {
                gamePlayContent.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-triangle text-6xl text-red-400 mb-4"></i>
                        <p class="text-red-500 text-lg">خطا در بارگذاری اطلاعات بازی</p>
                    </div>
                `;
                return;
            }

            debugLog('رندر کردن بازی:', gameData);
            
            let gameStatus = '';
            let statusColor = '';
            if (gameData.status === 'waiting') {
                gameStatus = '⏳ در انتظار بازیکن';
                statusColor = 'bg-yellow-100 text-yellow-800';
            } else if (gameData.status === 'active') {
                gameStatus = '🎮 بازی در جریان';
                statusColor = 'bg-green-100 text-green-800';
            } else if (gameData.status === 'won') {
                gameStatus = '🎉 برنده شدید!';
                statusColor = 'bg-green-100 text-green-800';
            } else if (gameData.status === 'lost') {
                gameStatus = '💔 باختید';
                statusColor = 'bg-red-100 text-red-800';
            }
            
            // بخش اقدامات (صفحه کلید)
            let actionSection = '';
            if (gameData.status === 'active' && gameData.isPlayer) {
                actionSection = `
                    <div class="glass-card rounded-2xl p-6 mb-6">
                        <h3 class="text-xl font-black text-gray-800 mb-4 text-center">⌨️ صفحه کلید</h3>
                        <div id="keyboard" class="grid grid-cols-7 gap-2 mb-4">
                            ${generatePersianKeyboard()}
                        </div>
                        <div class="text-center">
                            <button onclick="skipTurn()" class="bg-gray-500 text-white px-6 py-3 rounded-2xl font-bold hover:bg-gray-600 transition-colors">
                                <i class="fas fa-forward ml-2"></i>رد کردن نوبت
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameData.status === 'waiting') {
                actionSection = `
                    <div class="glass-card rounded-2xl p-6 mb-6 text-center">
                        <i class="fas fa-clock text-6xl text-yellow-500 mb-4"></i>
                        <h3 class="text-xl font-black text-gray-800 mb-2">در انتظار بازیکن</h3>
                        <p class="text-gray-600">کد بازی: <span class="font-mono font-bold text-2xl">${gameData.gameCode}</span></p>
                        <p class="text-gray-500 text-sm mt-2">این کد را با دوست خود به اشتراک بگذارید</p>
                    </div>
                `;
            }
            
            // بخش نتایج
            let resultSection = '';
            if (gameData.status === 'won' || gameData.status === 'lost') {
                resultSection = `
                    <div class="glass-card rounded-2xl p-6 mb-6 text-center ${statusColor} border-2">
                        <i class="fas ${gameData.status === 'won' ? 'fa-trophy text-green-500' : 'fa-times-circle text-red-500'} text-6xl mb-4"></i>
                        <h3 class="text-2xl font-black mb-2">${gameStatus}</h3>
                        <p class="text-lg mb-4">کلمه: <span class="font-bold">${gameData.actualWord || 'نامشخص'}</span></p>
                        ${gameData.finalScoreChange ? `<p class="text-lg">امتیاز: ${gameData.finalScoreChange > 0 ? '+' : ''}${gameData.finalScoreChange}</p>` : ''}
                    </div>
                `;
            }

            gamePlayContent.innerHTML = `
                <div class="glass-card rounded-2xl p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-xl font-black text-gray-800">${gameData.creatorName || 'سازنده'} vs ${gameData.playerName || 'بازیکن'}</h3>
                            <p class="text-gray-600">کد بازی: ${gameData.gameCode}</p>
                        </div>
                        <div class="text-left">
                            <span class="${statusColor} px-3 py-1 rounded-full text-sm font-bold">${gameStatus}</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div class="text-center">
                            <p class="text-gray-600">دسته‌بندی</p>
                            <p class="font-bold text-lg">${gameData.category || 'نامشخص'}</p>
                        </div>
                        <div class="text-center">
                            <p class="text-gray-600">سطح</p>
                            <p class="font-bold text-lg">${gameData.difficulty || 'نامشخص'}</p>
                        </div>
                        <div class="text-center">
                            <p class="text-gray-600">فرصت باقی‌مانده</p>
                            <p class="font-bold text-lg">${gameData.attemptsLeft !== undefined ? gameData.attemptsLeft : '?'} / 10</p>
                        </div>
                    </div>
                </div>
                
                <div class="glass-card rounded-2xl p-6 mb-6 text-center">
                    <h3 class="text-xl font-black text-gray-800 mb-4">🎯 کلمه</h3>
                    <div class="word-display text-3xl font-mono bg-gray-100 p-6 rounded-2xl mb-4 min-h-[120px] flex items-center justify-center">
                        ${gameData.wordToDisplay || '_ _ _ _ _'}
                    </div>
                    ${gameData.timeRemainingSeconds ? `
                        <p class="text-gray-600">زمان باقی‌مانده: ${Math.floor(gameData.timeRemainingSeconds / 60)}:${(gameData.timeRemainingSeconds % 60).toString().padStart(2, '0')}</p>
                    ` : ''}
                </div>
                
                ${resultSection}
                
                ${actionSection}
                
                <div class="glass-card rounded-2xl p-6">
                    <h3 class="text-xl font-black text-gray-800 mb-4">📊 وضعیت بازی</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-bold text-green-600 mb-2">✅ حروف درست</h4>
                            <div class="flex flex-wrap gap-2 min-h-[40px]">
                                ${(gameData.correctGuessedLetters && gameData.correctGuessedLetters.length > 0) ? 
                                    gameData.correctGuessedLetters.map(letter => `
                                        <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-lg">${letter}</span>
                                    `).join('') : 
                                    '<p class="text-gray-500 text-sm">هنوز حرف درستی حدس زده نشده</p>'
                                }
                            </div>
                        </div>
                        <div>
                            <h4 class="font-bold text-red-600 mb-2">❌ حروف اشتباه</h4>
                            <div class="flex flex-wrap gap-2 min-h-[40px]">
                                ${(gameData.incorrectGuessedLetters && gameData.incorrectGuessedLetters.length > 0) ? 
                                    gameData.incorrectGuessedLetters.map(letter => `
                                        <span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-lg">${letter}</span>
                                    `).join('') : 
                                    '<p class="text-gray-500 text-sm">هنوز حرف اشتباهی حدس زده نشده</p>'
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // مقداردهی اولیه صفحه کلید اگر بازی فعال است
            if (gameData.status === 'active' && gameData.isPlayer) {
                setTimeout(() => {
                    initializeKeyboard(
                        gameData.correctGuessedLetters || [], 
                        gameData.incorrectGuessedLetters || []
                    );
                }, 100);
            }
        }

        function generatePersianKeyboard() {
            const persianLetters = 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';
            let keyboardHTML = '';
            
            for (let letter of persianLetters) {
                keyboardHTML += `
                    <button onclick="makeGuess('${letter}')" 
                            class="keyboard-btn bg-gray-200 text-gray-800 rounded-xl font-bold hover:bg-gray-300 transition-colors"
                            data-letter="${letter}">
                        ${letter}
                    </button>
                `;
            }
            
            return keyboardHTML;
        }

        function initializeKeyboard(correctLetters, incorrectLetters) {
            const keyboardButtons = document.querySelectorAll('#keyboard button');
            
            keyboardButtons.forEach(button => {
                const letter = button.getAttribute('data-letter');
                
                if (correctLetters.includes(letter)) {
                    button.className = 'keyboard-btn correct-guess rounded-xl font-bold text-lg cursor-not-allowed';
                    button.disabled = true;
                } else if (incorrectLetters.includes(letter)) {
                    button.className = 'keyboard-btn incorrect-guess rounded-xl font-bold text-lg cursor-not-allowed';
                    button.disabled = true;
                }
            });
        }

        async function makeGuess(letter) {
            if (!letter || !currentActiveGameCode) {
                showNotification('خطا', 'خطا در ارسال حدس', 'error');
                return;
            }

            showLoading();
            try {
                debugLog('ارسال حدس:', { gameCode: currentActiveGameCode, letter, playerId: userId });
                
                const response = await fetch(`${API_BASE_URL}/api/game/guess`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameCode: currentActiveGameCode,
                        playerId: userId,
                        guess: letter
                    })
                });

                if (!response.ok) {
                    throw new Error(`خطای سرور: ${response.status}`);
                }

                const data = await response.json();
                debugLog('پاسخ حدس:', data);

                if (data.success) {
                    showNotification(data.isCorrect ? 'آفرین!' : 'اشتباه!', data.message, data.isCorrect ? 'success' : 'error');
                    
                    // بارگذاری مجدد وضعیت بازی
                    await loadGamePlay(currentActiveGameCode);
                    
                } else {
                    showNotification('خطا', data.message, 'error');
                }
            } catch (error) {
                console.error('❌ خطا در ارسال حدس:', error);
                showNotification('خطا', 'خطا در ارسال حدس', 'error');
            } finally {
                hideLoading();
            }
        }

        function skipTurn() {
            showNotification('توجه', 'نوبت رد شد', 'info');
            // در اینجا می‌توانید منطق رد کردن نوبت را پیاده‌سازی کنید
        }

        function joinGameFromList(gameCode) {
            document.getElementById('joinGameCode').value = gameCode;
            showTab('join-game');
        }

        function viewGameStatus(gameCode) {
            loadGamePlay(gameCode);
        }

        // راه‌اندازی اولیه
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('صفحه بارگذاری شد - شروع راه‌اندازی...');
            initTelegramWebApp();
            
            // پشتیبانی از کلید Enter در فیلد پیوستن
            document.getElementById('joinGameCode')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    joinGame();
                }
            });
        });
    </script>
</body>
</html>
