<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <title>وردلی رقابتی</title>
  
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    (function detectUi(){
      const supportsBackdrop = CSS.supports && (CSS.supports('backdrop-filter','blur(10px)') || CSS.supports('-webkit-backdrop-filter','blur(10px)'));
      if(supportsBackdrop) document.documentElement.classList.add('glassy');
      else document.documentElement.classList.add('flat');
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font: 'Vazirmatn', sans-serif;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --bg-body: #f3f4f6;
      --bg-panel: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .glassy {
      --bg-body: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
      --bg-panel: rgba(255, 255, 255, 0.8);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    }
    body { margin: 0; font-family: var(--font); background: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden;
    }

    .app-container { display: flex; flex-direction: column; height: 100%; max-width: 1200px; margin: 0 auto;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px;
      background: rgba(255,255,255,0.5); border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .logo { font-weight: 900; font-size: 20px; color: var(--primary); display: flex;
    align-items: center; gap: 8px; }
    .logo span { background: var(--primary); color: white; width: 32px; height: 32px;
    border-radius: 8px; display: grid; place-items: center; }
    
    .user-info { display: flex; flex-direction: column;
    align-items: flex-end; font-size: 13px; }
    .user-info b { font-size: 14px;
    }

    .main-grid {
      display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px;
    flex: 1; overflow: hidden;
    }
    @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; overflow-y: auto;
    } }

    .panel {
      background: var(--bg-panel); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px;
    display: flex; flex-direction: column;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .glassy .panel { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; padding: 0 20px;
    }
    .tab-btn {
      border: none; background: transparent; padding: 10px 0;
      font-family: var(--font);
    font-weight: 700; color: var(--text-muted);
      cursor: pointer; position: relative; transition: 0.3s;
    }
    .tab-btn.active { color: var(--primary);
    }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: 0; left: 0;
    width: 100%; height: 3px;
      background: var(--primary); border-radius: 10px;
    }

    .btn {
      border: none;
    padding: 10px 16px; border-radius: 12px; cursor: pointer;
      font-family: var(--font); font-weight: 700; font-size: 14px;
      transition: transform 0.1s; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary);
    color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .btn-ghost { background: rgba(0,0,0,0.05); color: var(--text-main);
    }
    .btn-danger { background: #fee2e2; color: var(--danger); }

    .room-list { display: flex; flex-direction: column;
    gap: 10px; overflow-y: auto; max-height: 300px; }
    .room-item {
      display: flex;
    justify-content: space-between; align-items: center;
      padding: 12px; background: white; border-radius: 12px; border: 1px solid #e5e7eb;
    }
    .room-info h4 { margin: 0 0 4px 0; font-size: 15px;
    }
    .room-meta { font-size: 12px; color: var(--text-muted); }

    .game-header { display: flex; justify-content: space-between;
    margin-bottom: 20px; align-items: center; }
    .timer-box { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--primary); background: #e0e7ff;
    padding: 4px 10px; border-radius: 8px; }
    
    .slots-area { display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center; margin: 20px 0; }
    .slot {
      width: 48px;
    height: 56px; border: 2px solid #d1d5db; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; background: white;
    transition: all 0.3s ease;
    }
    .slot.gap { border: none; background: transparent; width: 10px;
    }
    .slot.correct { background: var(--success); border-color: var(--success); color: white; transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4); }
    .slot.revealed { background: #f3f4f6; border-color: #9ca3af;
    }

    .input-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
    }
    .letter-input {
      width: 60px; height: 60px; text-align: center; font-size: 24px;
    font-weight: 700;
      border: 2px solid var(--primary); border-radius: 12px; outline: none;
    }
    
    .chips-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 30px;
    }
    .chip { padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: 700;
    }
    .chip.correct { background: #d1fae5; color: #065f46; }
    .chip.wrong { background: #fee2e2; color: #991b1b;
    }

    .player-card {
      background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px;
    border: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center;
    }
    .player-card.me { border: 2px solid var(--primary-light);
    background: #eef2ff; }
    .p-name { font-weight: 700; font-size: 14px; }
    .p-score { font-weight: 900;
    color: var(--primary); font-size: 16px; }
    .p-status { font-size: 11px; color: var(--text-muted); margin-top: 4px;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: white;
    padding: 24px; border-radius: 20px; width: 90%; max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    .hidden { display: none !important; }
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0);
    } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0);
    } 40%, 60% { transform: translate3d(4px, 0, 0); } }

    /* NEW: History Styles */
    .history-list-scroll {
      overflow-y: auto;
      flex: 1; 
      padding-top: 5px;
    }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: var(--bg-panel); padding: 15px; border-radius: var(--radius);
      border: 1px solid #e5e7eb; display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .history-item .game-info {
        grid-column: 1 / 3;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px dashed #eee; padding-bottom: 8px; margin-bottom: 8px;
    }
    .history-item .date { font-size: 13px; color: var(--text-muted); }
    .history-item .game-result {
        grid-column: 1 / 3;
        display: flex; justify-content: space-around; font-size: 15px; font-weight: 500;
    }
    .history-item .game-meta {
        grid-column: 1 / 3;
        display: flex; justify-content: space-around; font-size: 12px; color: var(--text-muted);
        margin-top: 5px;
    }
    .rank-badge {
        font-weight: 800; padding: 4px 10px; border-radius: 8px;
        background: #f3f4f6; color: var(--text-main); font-size: 14px;
    }
    .rank-badge.rank-1 { background: #ffe6a7; color: #b76e00; } /* Gold */
    .rank-badge.rank-2 { background: #e5e5e5; color: #4b5563; } /* Silver */
    .rank-badge.rank-3 { background: #e4ccb1; color: #7f5c40; } /* Bronze */
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo"><span>و</span>وردلی رقابتی</div>
    <div class="user-info">
      <b id="headerUsername">مهمان</b>
      <span id="headerUserId" style="opacity:0.6">ID: ...</span>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" data-target="dashboard">لابی</button>
    <button class="tab-btn" data-target="history">تاریخچه بازی‌ها</button>
    <button class="tab-btn" data-target="game" id="gameTabBtn" style="display:none">بازی فعال</button>
  </nav>

  <div class="main-grid">
    <div class="content-area">
      
      <section id="view-dashboard" class="panel" style="height:100%">
        <div 
          style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3>اتاق‌های بازی</h3>
          <button id="btnNewRoom" class="btn btn-primary">ساخت اتاق +</button>
        </div>
        <div id="resumeBanner" class="hidden" style="background:#eff6ff; border:1px solid #bfdbfe; padding:12px; border-radius:12px;
          margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:800;
              color:#1e40af">بازی در جریان دارید</div>
            <div style="font-size:12px;
              color:#3b82f6" id="resumeRoomName">...</div>
          </div>
          <button id="btnResume" class="btn btn-primary" style="font-size:12px;">بازگشت به بازی</button>
        </div>
        <div style="display:flex;
          gap:10px; margin-bottom:10px;">
           <select id="filterLevel" style="padding:8px; border-radius:8px;
             border:1px solid #ccc">
             <option value="">همه سطوح</option>
             <option value="easy">آسان</option>
             <option value="medium">متوسط</option>
             <option value="hard">سخت</option>
           </select>
           <button id="btnRefresh" class="btn btn-ghost">بروزرسانی</button>
        </div>
        
        <div id="roomsListContainer" class="room-list">
          <div style="text-align:center; color:#999;
            margin-top:20px;">در حال بارگذاری...</div>
        </div>
      </section>

      <section id="view-history" class="panel hidden" style="height:100%">
          <h3 style="margin-top:0">تاریخچه بازی‌های شما</h3>
          <div id="historyListContainer" class="history-list-scroll">
               <p class="text-center" style="color:#999; margin-top:20px;">در حال بارگذاری...</p>
          </div>
      </section>

      <section id="view-game" class="panel hidden" style="height:100%">
        <div class="game-header">
          <div>
            <h3 style="margin:0">کلمه <span id="lblWordIndex">۱</span> از ۱۰</h3>
            <div style="font-size:12px;
              color:#666"><span id="lblCategory">...</span> | <span id="lblLevel">...</span></div>
          </div>
          <div class="timer-box" id="lblTimer">۰۰:۰۰</div>
        </div>
        <div id="slotsContainer" class="slots-area"></div>
        <div style="margin-top:auto;
          margin-bottom:20px;">
          <div class="input-area">
            <input id="txtLetter" class="letter-input" maxlength="1" placeholder="؟" autocomplete="off">
            <button id="btnGuess" class="btn btn-primary" style="min-width:80px">ثبت</button>
            <button id="btnHint" class="btn btn-ghost">راهنما</button>
          </div>
          <div style="text-align:center;
            font-size:12px; margin-bottom:10px;"> مجاز: <span id="lblWrongCount">0</span> / <span id="lblAllowedWrong">-</span> </div>
          <div style="text-align:center; margin-bottom:8px; font-size:12px; font-weight:700;
            color:var(--success)">حروف صحیح</div>
          <div id="chipsCorrect" class="chips-container" style="margin-bottom:16px;"></div>
          <div style="text-align:center; margin-bottom:8px; font-size:12px; font-weight:700;
            color:var(--danger)">حروف غلط</div>
          <div id="chipsWrong" class="chips-container"></div>
        </div>
      </section>
    </div>
    <aside class="panel">
      <h4 style="margin-top:0">بازیکنان</h4>
      <div id="playersListContainer" style="display:flex; flex-direction:column; gap:8px; overflow-y:auto;
        flex:1;">
        <div style="text-align:center; color:#999; font-size:12px;">در انتظار...</div>
      </div>
      <hr style="border:0; border-top:1px solid #eee;
        margin:16px 0;">
      <div id="gameControls" class="hidden">
        <button id="btnLeave" class="btn btn-danger" style="width:100%;
          margin-bottom:8px;">ترک بازی</button>
        <button id="btnBackMenu" class="btn btn-ghost" style="width:100%">بازگشت به منو</button>
      </div>
    </aside>
  </div>
</div>

<div id="modalCreate" class="modal-backdrop">
  <div class="modal-content">
    <h3>ساخت اتاق جدید</h3>
    <div style="display:flex;
      flex-direction:column; gap:12px;">
      <input id="txtRoomName" placeholder="نام اتاق (اختیاری)" class="text-input"/>
      <select id="selLevel" class="text-input">
        <option value="medium">سطح: متوسط</option>
        <option value="easy">سطح: آسان</option>
        <option value="hard">سطح: سخت</option>
      </select>
      <select id="selMaxPlayers" class="text-input">
        <option value="2">حداکثر بازیکن: ۲</option>
        <option value="3">حداکثر بازیکن: ۳</option>
        <option value="4">حداکثر بازیکن: ۴</option>
      </select>
      <select id="selRevealMode" class="text-input">
        <option value="private">حالت کلمات: خصوصی (فقط خودم کلمه را می‌بینم)</option>
        <option value="shared">حالت کلمات: مشترک (همه یک کلمه را می‌بینند)</option>
      </select>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
      <button id="btnCloseModal" class="btn btn-ghost">انصراف</button>
      <button id="btnCreateRoom" class="btn btn-primary">ایجاد</button>
    </div>
  </div>
</div>

<div id="modalGameFinished" class="modal-backdrop">
    <div class="modal-content" style="text-align:center">
        <h3 style="color:var(--primary)">بازی به پایان رسید!</h3>
        <p>تمام کلمات حدس زده شدند و نتایج نهایی مشخص شد:</p>
        <div id="finalResultsContainer" style="display:flex; flex-direction:column; gap:10px; margin:20px 0; max-height: 250px; overflow-y: auto;">
            </div>
        <button onclick="window.location.reload();" class="btn btn-primary" style="width:100%">بازگشت به لابی</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
let state = {
  TWA: window.Telegram?.WebApp,
  user: null,
  socket: null,
  rooms: [],
  gameId: null,
  gameDeck: null,
  gameState: null,
  timerInterval: null,
  timerMs: 0,
  revealMode: 'private',
  isHost: false
};

const normalize = ch => {
  if (!ch) return '';
  const map = { '\u064A':'\u06CC', '\u0643':'\u06A9' };
  return (map[ch] || ch).normalize('NFC');
};

const toFaDigits = n => {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
};

// NEW: Function to robustly display user name (ایراد اول)
function getUserDisplayName(user) {
  if (!user) return 'کاربر ناشناس';
  let displayName = '';
  // Prioritize first and last name from Telegram WebApp
  if (user.first_name) {
    displayName += esc(user.first_name);
  }
  if (user.last_name) {
    if (displayName) displayName += ' ';
    displayName += esc(user.last_name);
  }
  if (displayName) return displayName;
  
  // Fallback to username
  if (user.username) return '@' + esc(user.username);
  
  // Final fallback
  return 'کاربر'; 
}

// NEW: Function to format duration for history (ایراد دوم)
function formatDuration(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function esc(s){ return s ? s.replace(/</g,'&lt;') : ''; }
function trLevel(l){ return l==='easy'?'آسان':(l==='hard'?'سخت':'متوسط'); }

function updateUi() {
  if (state.user) {
    // UPDATED: Use the new function for the header name
    $('headerUsername').textContent = getUserDisplayName(state.user); 
    $('headerUserId').textContent = 'ID: ' + state.user.id;
  }
  
  // Tab logic
  const viewDashboard = $('view-dashboard');
  const viewGame = $('view-game');
  const viewHistory = $('view-history'); 

  document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = (e) => {
          const target = e.target.getAttribute('data-target');
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');

          viewDashboard.classList.add('hidden');
          viewGame.classList.add('hidden');
          viewHistory.classList.add('hidden'); 

          if (target === 'dashboard') {
              viewDashboard.classList.remove('hidden');
          } else if (target === 'game') {
              viewGame.classList.remove('hidden');
          } else if (target === 'history') { // Handle history tab (ایراد دوم)
              viewHistory.classList.remove('hidden');
              // Request history data from server
              socket.emit('history:request', { user_id: state.user.id });
          }
          
          if (state.TWA) {
              if (target === 'dashboard' || target === 'history') {
                  state.TWA.MainButton.hide();
              } else if (target === 'game' && state.gameId) {
                  state.TWA.MainButton.show();
              }
          }
      };
  });
}

function renderRooms(rooms) {
  const container = $('roomsListContainer');
  if (!rooms || rooms.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:#999; margin-top:20px;">هیچ اتاق فعالی یافت نشد.</div>';
    return;
  }

  container.innerHTML = rooms.map(room => `
    <div class="room-item">
      <div class="room-info">
        <h4>${esc(room.name)}</h4>
        <div class="room-meta">
          ${trLevel(room.level)} |
          ${toFaDigits(room.players)}/${toFaDigits(room.max_players)} بازیکن |
          ${room.reveal_mode === 'shared' ? 'مشترک' : 'خصوصی'}
        </div>
      </div>
      ${room.status === 'waiting' ? 
        `<button class="btn btn-primary btn-join" data-room-id="${esc(room.id)}">ورود</button>` :
        `<button class="btn btn-ghost" disabled>در حال بازی</button>`
      }
    </div>
  `).join('');

  document.querySelectorAll('.btn-join').forEach(btn => {
    btn.onclick = () => {
      const room_id = btn.getAttribute('data-room-id');
      socket.emit('room:join', { room_id, user_id: state.user.id });
    };
  });
}

function renderRoom(room) {
  if (!room.game_id) {
    $('gameControls').classList.add('hidden');
    $('playersListContainer').innerHTML = `<p style="text-align:center; color:#999;">منتظر شروع بازی...</p>`;
    return;
  }

  // UPDATED: Use getUserDisplayName for player list (ایراد اول)
  const playersHtml = room.players.map(p => {
      const isSelf = p.user_id === state.user.id;
      return `
    <div class="player-card ${isSelf ? 'me' : ''}">
        <div>
            <div class="p-name">${getUserDisplayName(p.user)}</div>
            <div class="p-status">${p.role === 'host' ? 'میزبان' : 'بازیکن'} | کلمات حدس‌زده: ${toFaDigits(p.guessed_count || 0)}</div>
        </div>
        <div class="p-score">${toFaDigits(p.score || 0)}</div>
    </div>
  `}).join('');
  
  $('playersListContainer').innerHTML = playersHtml;
  $('gameControls').classList.remove('hidden');

  if (room.status === 'in_game' && room.game_id) {
    $('gameTabBtn').style.display = 'inline-block';
    
    // Auto-switch to game tab if this is a join/resume action
    if ($('view-dashboard').classList.contains('active') && state.gameId === room.game_id) {
        $('gameTabBtn').click();
    }
  }
}

function renderGame(gameState) {
  state.gameState = gameState;
  state.gameId = gameState.game_id;
  state.gameDeck = gameState.deck;
  state.timerMs = gameState.timer_ms;

  const currentWord = gameState.deck[gameState.current_index];
  const { correct_letters, wrong_letters, allowed_wrong, current_index, deck, score } = gameState;
  const wordText = currentWord.word;
  const isShared = gameState.reveal_mode === 'shared';
  
  $('lblWordIndex').textContent = toFaDigits(current_index + 1);
  $('lblCategory').textContent = currentWord.category;
  $('lblLevel').textContent = trLevel(currentWord.level);
  $('lblAllowedWrong').textContent = toFaDigits(allowed_wrong);
  $('lblWrongCount').textContent = toFaDigits(wrong_letters.length);

  // Slots
  let slotsHtml = '';
  for (let i = 0; i < wordText.length; i++) {
    const char = normalize(wordText[i]);
    if (char === ' ' || char === '\u200c' || char === '\u200d') { // Space or zero-width non-joiner
      slotsHtml += '<div class="slot gap"></div>';
    } else {
      const isCorrect = correct_letters.includes(char);
      const content = isCorrect ? char : (isShared ? (correct_letters.includes(char) ? char : '') : '');
      const cls = isCorrect ? 'correct' : (isShared ? 'revealed' : '');
      slotsHtml += `<div class="slot ${cls}">${esc(content)}</div>`;
    }
  }
  $('slotsContainer').innerHTML = slotsHtml;

  // Chips (Correct)
  $('chipsCorrect').innerHTML = [...new Set(correct_letters.filter(c => !wrong_letters.includes(c)))]
    .sort()
    .map(c => `<span class="chip correct">${esc(c)}</span>`)
    .join('');

  // Chips (Wrong)
  $('chipsWrong').innerHTML = [...new Set(wrong_letters)]
    .sort()
    .map(c => `<span class="chip wrong">${esc(c)}</span>`)
    .join('');

  if (wrong_letters.length >= allowed_wrong) {
    // Game over for this word (if not shared) or just failure
    $('btnGuess').disabled = true;
    $('btnHint').disabled = true;
    $('txtLetter').disabled = true;
    $('txtLetter').value = 'ناکام';
    $('txtLetter').classList.add('shake');
  } else {
    $('btnGuess').disabled = false;
    $('btnHint').disabled = false;
    $('txtLetter').disabled = false;
    $('txtLetter').focus();
    $('txtLetter').classList.remove('shake');
  }
  
  startTimer();
}

// NEW: Function to render game history (ایراد دوم)
function renderHistory(history) {
    const container = $('historyListContainer');
    if (!history || history.length === 0) {
        container.innerHTML = '<p class="text-center" style="color:#999; margin-top:20px;">تاریخچه بازی‌های شما خالی است.</p>';
        return;
    }

    const historyHtml = history.map(game => {
        let rankClass = '';
        if (game.rank === 1) rankClass = 'rank-1';
        else if (game.rank === 2) rankClass = 'rank-2';
        else if (game.rank === 3) rankClass = 'rank-3';

        return `
        <div class="history-item">
            <div class="game-info">
                <span class="rank-badge ${rankClass}">رتبه ${toFaDigits(game.rank)}</span>
                <span class="date">${new Date(game.end_time).toLocaleDateString('fa-IR', { year: 'numeric', month: 'numeric', day: 'numeric' })}</span>
            </div>
            <div class="game-result">
                <span>امتیاز: <b style="color:var(--primary)">${toFaDigits(game.score)}</b></span>
                <span>کلمات: ${toFaDigits(game.words_guessed)}</span>
                <span>زمان: ${toFaDigits(formatDuration(game.timer_ms))}</span>
            </div>
            <div class="game-meta">
                <span>سطح: ${trLevel(game.level)}</span>
                <span>(${toFaDigits(game.rank)} از ${toFaDigits(game.total_players)} بازیکن)</span>
            </div>
        </div>
        `;
    }).join('');

    container.innerHTML = `<div class="history-list">${historyHtml}</div>`;
}

function startTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timerMs += 1000;
    const s = Math.floor(state.timerMs/1000);
    $('lblTimer').textContent = toFaDigits(String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'));
  }, 1000);
}

// Initial setup
document.addEventListener('DOMContentLoaded', () => {
  updateUi();
  if (state.TWA) {
    state.TWA.ready();
    state.TWA.expand();
    state.TWA.MainButton.setText('ثبت حدس');
    state.TWA.MainButton.onClick(() => $('btnGuess').click());

    if (state.TWA.initDataUnsafe.user) {
      state.user = state.TWA.initDataUnsafe.user;
      fetch('/auth/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: state.user })
      });
      // Try to resume game immediately after auth
      socket.emit('room:resume', { user_id: state.user.id });
    } else {
       // Fallback for testing without TWA
       state.user = { id: 1000000000, first_name: 'کاربر', last_name: 'تست', username: 'tester' };
    }
  } else {
    // Fallback for testing without TWA
    state.user = { id: 1000000000, first_name: 'کاربر', last_name: 'تست', username: 'tester' };
  }

  // Connect Socket.IO
  const socketProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const socketUrl = `${socketProtocol}://${window.location.host}`;
  state.socket = io(socketUrl);
  const socket = state.socket;

  socket.on('connect', () => {
    console.log('Connected to server');
    if (state.user) {
      socket.emit('auth', { user_id: state.user.id });
      fetchRooms();
    }
  });

  socket.on('rooms:list', (data) => {
    state.rooms = data.rooms;
    renderRooms(data.rooms);
  });
  
  socket.on('room:joined', (data) => {
    console.log('Joined room:', data.room_id);
    state.roomId = data.room_id;
    state.isHost = data.is_host;
    state.revealMode = data.reveal_mode;
    renderRoom(data.room);
    
    // Switch view
    document.querySelector('.tab-btn[data-target="game"]').click();
  });

  socket.on('room:left', (data) => {
    console.log('Left room:', data.room_id);
    state.roomId = null;
    state.isHost = false;
    state.gameId = null;
    state.revealMode = 'private';
    $('gameTabBtn').style.display = 'none';
    if(state.timerInterval) clearInterval(state.timerInterval);
    
    // Switch view
    document.querySelector('.tab-btn[data-target="dashboard"]').click();
    fetchRooms(); // Refresh room list
  });

  socket.on('room:state', (data) => {
    // Only update if we are in this room
    if (data.room.id === state.roomId) {
      renderRoom(data.room);
      if (data.room.game_state) {
        renderGame(data.room.game_state);
      }
    }
    // Also check if any player is in a resumed game and update banner
    const resumedRoom = data.rooms.find(r => r.game_id && r.players.some(p => p.user_id === state.user.id));
    if (resumedRoom && resumedRoom.id !== state.roomId) {
        $('resumeBanner').classList.remove('hidden');
        $('resumeRoomName').textContent = `بازی در اتاق: ${esc(resumedRoom.name)}`;
        $('btnResume').setAttribute('data-room-id', resumedRoom.id);
    } else {
        $('resumeBanner').classList.add('hidden');
    }
  });
  
  socket.on('game:state', (data) => {
    if (data.game_id === state.gameId) {
        renderGame(data.game_state);
        renderRoom(data.room); // Update player scores/status
    }
  });
  
  socket.on('game:start', (data) => {
    if (data.room_id === state.roomId) {
      state.gameId = data.game_id;
      $('gameTabBtn').style.display = 'inline-block';
      $('gameTabBtn').click(); // Switch to game view
    }
  });

  // NEW: History list handler (ایراد دوم)
  socket.on('history:list', (data) => {
      renderHistory(data.history);
  });

  // NEW: Game Finished handler (ایراد سوم)
  socket.on('game:finished', (data) => {
      // Clear interval when game ends
      if(state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = null;
      state.gameId = null;
      $('gameTabBtn').style.display = 'none';

      const resultsHtml = data.results.map(r => {
          let color = '#ccc';
          if (r.rank === 1) color = '#FFD700'; // Gold
          else if (r.rank === 2) color = '#C0C0C0'; // Silver
          else if (r.rank === 3) color = '#CD7F32'; // Bronze
          
          return `
              <div style="display:flex; justify-content:space-between; padding:8px 12px; border-radius:8px; background:#f9f9f9; border-right:4px solid ${color}">
                  <span style="font-weight:700">${r.rank === 1 ? '🥇' : (r.rank === 2 ? '🥈' : (r.rank === 3 ? '🥉' : toFaDigits(r.rank) + '.'))} ${getUserDisplayName(r.user)}</span>
                  <span>امتیاز: ${toFaDigits(r.score)}</span>
              </div>
          `;
      }).join('');

      $('finalResultsContainer').innerHTML = resultsHtml;
      $('modalGameFinished').style.display = 'flex';
  });

  socket.on('error', (data) => {
    state.TWA?.showAlert(data.message || 'خطای ناشناخته در سرور');
  });

  // Event Listeners
  $('btnNewRoom').onclick = () => $('modalCreate').style.display = 'flex';
  $('btnCloseModal').onclick = () => $('modalCreate').style.display = 'none';
  $('btnBackMenu').onclick = () => document.querySelector('.tab-btn[data-target="dashboard"]').click();
  $('btnLeave').onclick = () => {
      state.TWA?.showConfirm('آیا مطمئنید که می‌خواهید از اتاق خارج شوید؟', (isConfirmed) => {
          if (isConfirmed) {
              socket.emit('room:leave', { room_id: state.roomId, user_id: state.user.id });
          }
      });
  };
  $('btnResume').onclick = (e) => {
      const room_id = e.target.getAttribute('data-room-id');
      if(room_id) {
         socket.emit('room:join', { room_id, user_id: state.user.id });
      }
  };
  $('btnRefresh').onclick = fetchRooms;

  $('btnCreateRoom').onclick = () => {
    const roomName = $('txtRoomName').value.trim();
    const level = $('selLevel').value;
    const maxPlayers = $('selMaxPlayers').value;
    const revealMode = $('selRevealMode').value;
    
    if (!state.user) return;

    $('modalCreate').style.display = 'none';
    socket.emit('room:create', { 
      user_id: state.user.id, 
      name: roomName, 
      level, 
      max_players: maxPlayers,
      reveal_mode: revealMode
    });
  };

  $('btnGuess').onclick = () => {
    const val = normalize($('txtLetter').value);
    if (!val || val.length !== 1) {
      state.TWA?.showAlert('فقط یک حرف فارسی وارد کنید.');
      return;
    }
    socket.emit('game:guess_letter', { game_id: state.gameId, user_id: state.user.id, letter: val });
    $('txtLetter').value = ''; $('txtLetter').focus();
  };
  
  $('txtLetter').onkeydown = (e) => { if(e.key === 'Enter') $('btnGuess').click(); };
  $('txtLetter').oninput = (e) => { 
      const v=normalize(e.target.value); 
      e.target.value = (v && /^[\u0600-\u06FF]$/.test(v)) ? v : ''; 
  };

  $('btnHint').onclick = () => {
       state.TWA?.showConfirm('آیا می‌خواهید از راهنما استفاده کنید؟ (امتیاز منفی دارد)', (isConfirmed) => {
          if (isConfirmed) {
              socket.emit('game:hint', { game_id: state.gameId, user_id: state.user.id });
          }
      });
  };

  $('filterLevel').onchange = fetchRooms;

  // Function to fetch rooms and send current timer to server
  function fetchRooms() {
    const level = $('filterLevel').value;
    fetch('/rooms/list?level=' + level)
      .then(res => res.json())
      .then(data => {
        if(data.ok) {
          state.rooms = data.rooms;
          renderRooms(data.rooms);
        }
      });
  }
  
  // Timer sync with server
  setInterval(() => {
    if (state.gameId && state.user && state.timerMs > 0) {
      socket.emit('game:timer', { 
        game_id: state.gameId, 
        user_id: state.user.id, 
        timer_ms: state.timerMs 
      });
    }
  }, 5000);
});

</script>
