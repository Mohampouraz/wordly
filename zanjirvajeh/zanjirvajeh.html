<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>زنجیرواژه</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Luxury minimal glassmorphism */
    :root {
      --bg: #0b0f14;
      --card: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.12);
      --text: #e8eef7;
      --muted: #9fb4cc;
      --accent: #66d1ff;
      --accent2: #ffc97a;
      --danger: #ff7a7a;
      --success: #79e0a7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(1000px 600px at 80% -20%, #16324a 0%, #0b0f14 45%) fixed;
      color: var(--text); font-family: Vazirmatn, ui-sans-serif, system-ui, -apple-system, Segoe UI;
    }
    .wrap {
      max-width: 760px; margin: 32px auto; padding: 24px;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .logo {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.04));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 8px 32px rgba(0,0,0,0.4);
      position: relative;
    }
    .logo::after {
      content: 'و'; position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--accent); font-weight: 700; font-size: 28px; text-shadow: 0 0 24px rgba(102,209,255,0.5);
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
    .muted { color: var(--muted); font-size: 13px; }

    .card {
      background: var(--card); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 16px; padding: 16px; margin: 16px 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .grow { flex: 1; }

    input, button, select {
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.16);
      background: var(--glass); color: var(--text);
      padding: 10px 12px; font-size: 14px;
      outline: none;
    }
    input::placeholder { color: #8da7bd; }
    button {
      cursor: pointer;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.primary { background: linear-gradient(180deg, rgba(102,209,255,0.35), rgba(102,209,255,0.18)); border-color: rgba(102,209,255,0.5); }
    button.warn { background: linear-gradient(180deg, rgba(255,122,122,0.35), rgba(255,122,122,0.18)); border-color: rgba(255,122,122,0.5); }
    button.ghost { background: rgba(255,255,255,0.08); }

    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }

    .status {
      display: flex; align-items: center; gap: 10px;
    }
    .badge {
      padding: 6px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      font-size: 13px;
    }
    .timer {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      display: grid; place-items: center; font-weight: 700;
      color: var(--accent2);
      box-shadow: inset 0 0 12px rgba(255,201,122,0.25);
    }
    .big-letter {
      font-size: 28px; font-weight: 800; color: var(--accent);
      letter-spacing: -0.5px; text-shadow: 0 0 24px rgba(102,209,255,0.35);
    }
    .history {
      display: grid; gap: 8px; max-height: 240px; overflow: auto;
    }
    .entry {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 8px 10px; font-size: 13px;
    }
    .entry .ok { color: var(--success); }
    .entry .bad { color: var(--danger); }

    .lb {
      display: grid; gap: 6px;
    }
    .lb .row {
      justify-content: space-between; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="title">زنجیرواژه</div>
        <div class="muted">کلمه را بساز که با حرف آخر قبلی شروع شود. سریع، دقیق، و شیشه‌ای.</div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <div class="row">
            <input id="name" class="grow" placeholder="نام نمایشی شما">
            <input id="userId" placeholder="شناسه کاربر (مثلاً 1001)">
            <button id="joinBtn" class="primary">پیوستن</button>
          </div>
          <div class="row" style="margin-top:10px;">
            <select id="mode">
              <option value="solo">Solo</option>
              <option value="duel">Duel</option>
              <option value="team">Team</option>
            </select>
            <input id="turnSec" type="number" min="5" max="60" value="20" style="width:120px" placeholder="زمان نوبت">
            <button id="newBtn" class="ghost">شروع بازی جدید</button>
          </div>
        </div>
        <div>
          <div class="status">
            <div class="badge">حرف شروع: <span id="letter" class="big-letter">—</span></div>
            <div class="badge">نوبت: <span id="current">—</span></div>
            <div class="timer" id="timer">0</div>
          </div>
          <div class="row" style="margin-top:10px;">
            <input id="word" class="grow" placeholder="کلمه شما...">
            <button id="submitBtn" class="primary">ارسال</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <div style="margin-bottom:8px;">تاریخچه</div>
          <div id="history" class="history"></div>
        </div>
        <div>
          <div style="margin-bottom:8px;">جدول امتیاز</div>
          <div id="lb" class="lb"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const api = {
      async newgame({ mode, turnSeconds }) {
        const res = await fetch('/api/newgame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode, turnSeconds })
        });
        return res.json();
      },
      async join({ userId, displayName }) {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, displayName })
        });
        return res.json();
      },
      async submit({ userId, word }) {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, word })
        });
        return res.json();
      },
      async state() {
        const res = await fetch('/api/state');
        return res.json();
      }
    };

    const el = {
      name: document.getElementById('name'),
      userId: document.getElementById('userId'),
      joinBtn: document.getElementById('joinBtn'),
      mode: document.getElementById('mode'),
      turnSec: document.getElementById('turnSec'),
      newBtn: document.getElementById('newBtn'),
      letter: document.getElementById('letter'),
      current: document.getElementById('current'),
      timer: document.getElementById('timer'),
      word: document.getElementById('word'),
      submitBtn: document.getElementById('submitBtn'),
      history: document.getElementById('history'),
      lb: document.getElementById('lb')
    };

    let me = { id: null, name: null };
    let tickHandle = null;

    function fmtName(id, users) {
      const u = users.find(x => String(x.id) === String(id));
      return (u && u.name) ? u.name : `کاربر ${id}`;
    }

    function renderState(s) {
      if (!s || !s.game) {
        el.letter.textContent = '—';
        el.current.textContent = '—';
        el.timer.textContent = '0';
        el.history.innerHTML = '';
        el.lb.innerHTML = '';
        return;
      }
      const g = s.game;
      el.letter.textContent = g.currentLetter || '—';
      el.current.textContent = g.currentPlayerId ? fmtName(g.currentPlayerId, s.users) : '—';

      const left = Math.max(0, Math.floor((g.expiresAt - s.now) / 1000));
      el.timer.textContent = left;

      // History
      el.history.innerHTML = '';
      (g.history || []).slice().reverse().forEach(h => {
        const row = document.createElement('div');
        row.className = 'entry';
        const who = fmtName(h.userId, s.users);
        const status = h.valid ? `<span class="ok">درست</span>` : `<span class="bad">نادرست</span>`;
        row.innerHTML = `
          <div>${who} — <strong>${h.word}</strong></div>
          <div>${status} • ${h.score || 0} امتیاز • بعدی: ${h.nextLetter || '—'}</div>
        `;
        el.history.appendChild(row);
      });

      // Leaderboard
      el.lb.innerHTML = '';
      const scores = g.scores || {};
      const rows = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
      rows.forEach(([uid, sc], i) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div>#${i+1} — ${fmtName(uid, s.users)}</div><div>${sc} امتیاز</div>`;
        el.lb.appendChild(row);
      });
    }

    async function sync() {
      try {
        const s = await api.state();
        renderState(s);
      } catch (e) {
        console.warn('sync error', e);
      }
    }

    function startTick() {
      if (tickHandle) clearInterval(tickHandle);
      tickHandle = setInterval(sync, 1000);
      sync();
    }

    // Events
    el.joinBtn.addEventListener('click', async () => {
      const id = el.userId.value.trim();
      const name = el.name.value.trim() || `کاربر ${id || 'ناشناخته'}`;
      if (!id) { alert('شناسه کاربر را وارد کنید'); return; }
      const r = await api.join({ userId: id, displayName: name });
      if (r.ok) {
        me.id = id; me.name = name;
        startTick();
      } else {
        alert(r.error || 'خطا در پیوستن');
      }
    });

    el.newBtn.addEventListener('click', async () => {
      const mode = el.mode.value;
      const turnSeconds = Math.max(5, Math.min(60, Number(el.turnSec.value || 20)));
      const r = await api.newgame({ mode, turnSeconds });
      if (r.ok) startTick();
    });

    el.submitBtn.addEventListener('click', async () => {
      const word = el.word.value.trim();
      if (!me.id) { alert('ابتدا به بازی بپیوندید'); return; }
      if (!word) { return; }
      const r = await api.submit({ userId: me.id, word });
      if (r.error) {
        alert(r.error);
      }
      if (!r.ok && r.reason) {
        alert(r.reason);
      }
      el.word.value = '';
      sync();
    });

    // Auto-start polling
    startTick();
  </script>
</body>
</html>
